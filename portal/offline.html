<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlgoHand — no connection</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f16">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
  html, body { margin: 0; min-height: 100%; background: #0b0f16; color: #f0f3fa; font: 16px/1.5 Inter, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 24px; box-sizing: border-box; }
  img { width: 88px; height: 88px; border-radius: 22px; margin-bottom: 22px; }
  h1 { font-size: 22px; margin: 0 0 10px; font-weight: 700; }
  p { color: #9aa4bf; margin: 0 0 24px; max-width: 420px; }
  button { background: #4f8bff; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <img src="/assets/icon-192.png" alt="">
  <h1 id="h">No connection</h1>
  <p id="p">Your EAs keep running on your VPS. Reconnect to check on them.</p>
  <button type="button" onclick="location.reload()" id="b">Try again</button>
</div>
<script>
  var L = { ru: ['Нет соединения', 'Ваши советники продолжают работать на VPS. Подключитесь к сети, чтобы проверить их.', 'Повторить'],
            es: ['Sin conexión', 'Tus EAs siguen funcionando en tu VPS. Vuelve a conectarte para revisarlos.', 'Reintentar'] };
  var l = (navigator.language || 'en').slice(0, 2);
  if (L[l]) { document.getElementById('h').textContent = L[l][0]; document.getElementById('p').textContent = L[l][1]; document.getElementById('b').textContent = L[l][2]; document.documentElement.lang = l; }
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
