openapi: 3.1.0
info:
  title: Terminal Control API (TCA)
  version: 0.2.1-draft
  summary: Operate MetaTrader 5 Expert Advisors on customer VPS machines from an AI chat or any API caller.
  description: |
    The Terminal Control API lets a dashboard agent (LLM tool-use) or a backend
    start, stop and re-configure Expert Advisors (EAs) running in MetaTrader 5
    terminals on a customer's Windows VPS, and read the live state of those
    terminals.

    ## Model

    * **Client** – one end customer of the integrating platform (identified by the
      platform's own `client_id`).
    * **VPS** – a Windows machine running the TCA agent and one or more MT5 terminals.
    * **Account** – one MT5 terminal logged into one broker account (`account_id`).
    * **Instance** – one EA running on one chart of an account (`instance_id`).
    * **EA** – a catalog entry (`ea_id`) describing a closed `.ex5`, its inputs,
      the whitelist of what may be changed, and risk presets.
    * **Command** – an asynchronous request to change something on a terminal
      (`command_id`). Created with `202 Accepted`, then polled.

    ## Guarantees

    * Every request acts for exactly one client. With a **client key** the client
      is fixed by the credential and cannot be overridden; with a **tenant key**
      `client_id` must be sent explicitly. Resources are only visible to the
      client that owns them. There is no shared database with the caller.
    * All validation (EA whitelist, symbol whitelist, parameter ranges, restart
      safety) is enforced server-side, regardless of what the caller validated.
      The LLM is never the security boundary.
    * Every command reports `requested` → `resolved` → `result.observed`: what was
      asked, what the server decided to apply, and what the terminal actually
      shows afterwards. A mismatch is a failure, not a success.
    * Every parameter change is implemented as a template re-application, which
      restarts the EA. Commands that would restart an EA with open positions are
      refused unless the EA's restart safety has been verified.

    ## Status

    Draft for integration review. Field names and error codes may still change
    before 1.0; paths, the command lifecycle and the shape of the dry-run
    preview (`CommandPreview`: summary, diff, requires_confirmation) will not.
  contact:
    name: MTCodec JSC
  license:
    name: Proprietary – licensed, not sold

servers:
  - url: https://api.tca.mtcodec.com
    description: Production (host to be confirmed)
  - url: https://sandbox.tca.mtcodec.com
    description: Sandbox against demo accounts

security:
  - bearerAuth: []

tags:
  - name: Catalog
    description: Which EAs exist, what can be changed on them, which presets exist.
  - name: State
    description: Live state of VPS machines, terminals, accounts and running EAs.
  - name: Commands
    description: Asynchronous actions on an account. Create → poll.
  - name: History
    description: Closed deals with per-EA attribution.
  - name: Provisioning
    description: Registering a customer's VPS and minting the one-time enrol token for the agent on it.
  - name: Backtests (v2)
    description: Strategy Tester runs on a dedicated tester pool. Specified for v2; not available in the pilot.
  - name: Meta

paths:
  /v1/health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Service health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version, time]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  version: { type: string, examples: ["0.1.0"] }
                  time: { type: string, format: date-time }

  /v1/eas:
    get:
      tags: [Catalog]
      operationId: listEas
      summary: List EAs in the catalog
      description: |
        Returns the catalog visible to the caller's tenant. Use it to map a user's
        words ("Waka", "the night scalper") to an `ea_id` and to show available
        risk presets. Parameter lists are not included here; call `getEa`.
      parameters:
        - $ref: "#/components/parameters/ClientIdQueryOptional"
        - name: status
          in: query
          description: Filter by registry status. Default returns `approved` only; pass `all` to include drafts (sandbox).
          schema: { type: string, enum: [approved, all], default: approved }
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                required: [eas]
                properties:
                  eas:
                    type: array
                    items: { $ref: "#/components/schemas/EaSummary" }
              examples:
                default:
                  value:
                    eas:
                      - ea_id: waka_waka
                        name: Waka Waka EA
                        vendor: valerytools.com
                        category: grid
                        description: Grid / averaging EA using Bollinger Bands and RSI for entries. Trades a list of symbols from a single chart.
                        status: approved
                        restart_safety: verified
                        supports_soft_stop: true
                        symbols_allowed: [AUDNZD, AUDCAD, NZDCAD, US500]
                        presets:
                          - { id: low, label: Low risk, description: "Vendor 'Low Risk Set 20% annual (0.25% load)'." }
                          - { id: medium, label: Medium risk, description: "Vendor 'Mid Risk Set 40% annual (0.5% load)' — the shipped default." }
                          - { id: significant, label: Significant risk, description: "Vendor 'Significant Risk Set 80% annual (1.0% load)'." }
                          - { id: high, label: High risk, description: "Vendor 'High Risk Set 120% annual (1.5% load)'." }
                        default_preset: medium
                      - ea_id: night_hunter_pro
                        name: Night Hunter Pro
                        vendor: valerytools.com
                        category: scalper
                        description: Night scalper. Pending orders, no grid.
                        status: approved
                        restart_safety: verified
                        supports_soft_stop: true
                        symbols_allowed: [GBPUSD, EURUSD, EURCHF, USDCAD, USDCHF, CHFJPY, AUDCAD, EURCAD, EURAUD]
                        presets:
                          - { id: low, label: Low risk, description: "Vendor 'Low Risk Set (0.5% per Trade)'." }
                          - { id: medium, label: Medium risk, description: "Vendor 'Mid Risk Set (2% per Trade)'." }
                          - { id: high, label: High risk, description: "Vendor 'High Risk Set (5% per Trade)'." }
                          - { id: risk_per_trade_5, label: Max risk per trade 5%, description: "Lots based on Max Risk per Trade, 5% of deposit per stop-loss hit." }
                        default_preset: medium
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/eas/{ea_id}:
    get:
      tags: [Catalog]
      operationId: getEa
      summary: Get one EA with its changeable parameters and presets
      description: |
        Full description of an EA: every caller-visible input with type, default,
        label, description, whether it may be changed via `set_param`, and the
        allowed range. Hidden/internal inputs are not returned. Use this before
        proposing a parameter change so the user sees the real name, the current
        default and the allowed range.
      parameters:
        - $ref: "#/components/parameters/EaId"
        - $ref: "#/components/parameters/ClientIdQueryOptional"
      responses:
        "200":
          description: EA detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EaDetail" }
              examples:
                perceptrader:
                  value:
                    ea_id: perceptrader_ai
                    name: Perceptrader AI
                    vendor: valerytools.com
                    category: grid
                    description: Grid / averaging EA with a neural-network entry filter.
                    status: approved
                    restart_safety: verified
                    supports_soft_stop: true
                    symbols_allowed: [NZDUSD, USDCAD, AUDNZD, AUDCAD, NZDCAD, GBPCHF]
                    default_preset: medium
                    presets:
                      - { id: low, label: Low risk, description: "Vendor 'Low Risk Set (0.25% load)'." }
                      - { id: medium, label: Medium risk, description: "Vendor 'Mid Risk Set (0.5% load)'." }
                      - { id: significant, label: Significant risk, description: "Vendor 'Significant Risk Set (1.0% load)'." }
                      - { id: high, label: High risk, description: "Vendor 'High Risk Set (1.5% load)'." }
                    parameters:
                      - name: AllowOpeningNewGrid
                        label: Allow Opening a new Grid
                        description: Enable/disable new grids. Does not affect open grids, which keep being managed.
                        type: bool
                        default: true
                        group: Select the risk settings
                        changeable: true
                        constraints: { allowed: [true, false] }
                        requires_confirmation: false
                      - name: MaximumSpread
                        label: Maximum Spread, in pips
                        description: Maximum allowed spread for opening positions.
                        type: double
                        default: 5.0
                        group: Select the risk settings
                        changeable: true
                        constraints: { min: 0.5, max: 50 }
                        requires_confirmation: false
                      - name: MaximumTrades
                        label: Maximum Trades
                        description: Maximum number of averaging trades in a grid.
                        type: int
                        default: 9
                        group: Adjust the grid distance and multipliers
                        changeable: true
                        constraints: { min: 1, max: 12 }
                        requires_confirmation: true
                      - name: LotSizingMethod
                        label: Lot-sizing Method
                        description: Fixed Lots / Dynamic Lots / Deposit load / predefined risk presets. Only the value parameter matching the chosen method applies.
                        type: enum
                        default: 7
                        group: Select the risk settings
                        changeable: true
                        constraints: { allowed: [0, 1, 2, 3, 4, 5, 6, 7] }
                        enum_labels: { "0": Fixed Lot, "1": Dynamic Lot based on Balance, "2": Dynamic Lot based on Equity, "3": Significant Risk Set (1.0% load), "4": Mid Risk Set (0.5% load), "5": Low Risk Set (0.25% load), "6": Lots based on Deposit load, "7": High Risk Set (1.5% load) }
                        requires_confirmation: true
                      - name: TradeDistance
                        label: Trade Distance
                        description: Minimum step in pips between averaging trades.
                        type: double
                        default: 25
                        group: Adjust the grid distance and multipliers
                        changeable: false
                        requires_confirmation: false
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/clients/{client_id}/vps:
    post:
      tags: [Provisioning]
      operationId: provisionVps
      summary: Register a VPS for a client and get its enrol token
      description: |
        Called by the integrating backend (or provisioning script) when a customer's VPS is
        created. Returns a **one-time enrol token**; the provisioning step writes it into the
        agent configuration on that machine. On first start the agent exchanges the token for
        an agent key that is **bound to that machine** (Windows MachineGuid + system volume
        serial): the key is stored under DPAPI on the VPS and every agent request carries the
        machine fingerprint, so a copied key does not work anywhere else. The token cannot be
        reused; if a machine is rebuilt, provision it again.

        Works with a client key (client fixed by the credential) or a tenant key
        (`client_id` in the path).
      parameters:
        - $ref: "#/components/parameters/ClientIdPath"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VpsCreate" }
            examples:
              easyvps:
                value: { external_ref: "VPS-3391-LDN", label: "London, Windows Server 2022 + MT5" }
      responses:
        "201":
          description: VPS registered; the enrol token is shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VpsProvisioned" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/clients/{client_id}/vps/{vps_id}:
    delete:
      tags: [Provisioning]
      operationId: decommissionVps
      summary: Decommission a VPS
      description: |
        Switches a VPS off on our side: no further commands are accepted for its accounts, and
        the agent on it stops and wipes its local state (templates, chart maps, agent key) at
        its next request. Use it when a customer cancels the VPS or it is rebuilt. Idempotent.
        To use the machine again, provision it afresh (`POST …/vps`) and re-enrol the agent.
      parameters:
        - $ref: "#/components/parameters/ClientIdPath"
        - name: vps_id
          in: path
          required: true
          schema: { type: string, pattern: "^vps_[a-z0-9]{6,}$", examples: [vps_7f3k2m] }
      responses:
        "200":
          description: Decommissioned
          content:
            application/json:
              schema:
                type: object
                required: [vps_id, client_id, status, decommissioned_at]
                properties:
                  vps_id: { type: string }
                  client_id: { $ref: "#/components/schemas/ClientId" }
                  status: { type: string, enum: [decommissioned] }
                  decommissioned_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/clients/{client_id}/state:
    get:
      tags: [State]
      operationId: getClientState
      summary: Live state of everything the client owns
      description: |
        One call to answer "what is running?": every VPS, every terminal/account,
        every EA instance with its effective inputs, open positions and pending
        orders with per-EA attribution, plus VPS health. This is the entry point
        for an LLM: it yields the `account_id` and `instance_id` values needed
        for commands.

        `as_of` is the time of the newest agent report; `stale: true` means the
        agent has not reported within the freshness window (default 90 s) and
        the numbers may be out of date.
      parameters:
        - $ref: "#/components/parameters/ClientIdPath"
        - name: include
          in: query
          description: Comma-separated sections to include. Default is everything.
          schema:
            type: string
            examples: ["accounts,instances", "accounts,instances,positions,orders,vps"]
      responses:
        "200":
          description: Client state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientState" }
              examples:
                twoTerminals:
                  value:
                    client_id: "ea-cust-1042"
                    as_of: "2026-09-02T10:15:07Z"
                    stale: false
                    vps:
                      - vps_id: vps_7f3k2m
                        status: online
                        agent_version: "0.1.0"
                        last_seen: "2026-09-02T10:15:07Z"
                        host: { hostname: EASYVPS-1042, os: "Windows Server 2022", cpu_pct: 12.5, mem_pct: 41.0, disk_free_gb: 38.2, uptime_s: 864211 }
                        terminals: 2
                    accounts:
                      - account_id: acc_9q1x7d
                        vps_id: vps_7f3k2m
                        mt5_login: 51234567
                        mt5_server: ICMarketsSC-MT5-2
                        broker: IC Markets
                        currency: USD
                        leverage: 500
                        type: real
                        terminal: { connected: true, build: 5120, trade_allowed: true, last_tick_at: "2026-09-02T10:15:06Z" }
                        balance: 10250.40
                        equity: 10198.12
                        margin: 312.50
                        free_margin: 9885.62
                        margin_level: 3263.4
                        floating_pnl: -52.28
                        as_of: "2026-09-02T10:15:07Z"
                        stale: false
                        instances:
                          - instance_id: inst_a1b2c3
                            ea_id: waka_waka
                            ea_name: Waka Waka EA
                            status: running
                            symbol: AUDNZD
                            timeframe: M15
                            preset: medium
                            uid: 0
                            inputs: { AllowOpeningNewGrid: true, LotSizingMethod: 4, MaximumSpread: 10, MaximumTrades: 9 }
                            magic_numbers: [184570000, 184570001, 284570000]
                            started_at: "2026-08-28T07:02:11Z"
                            last_command_id: cmd_01J6X0Q4M9
                            open_positions: 3
                            pending_orders: 0
                            floating_pnl: -52.28
                            health: { on_chart: true, last_seen_on_chart: "2026-09-02T10:15:06Z", errors: [] }
                        positions:
                          - ticket: 88123401
                            symbol: AUDNZD
                            type: buy
                            volume: 0.10
                            price_open: 1.09812
                            price_current: 1.09760
                            sl: 0
                            tp: 1.09912
                            profit: -31.20
                            swap: -1.10
                            magic: 184570000
                            comment: Waka
                            ea_id: waka_waka
                            instance_id: inst_a1b2c3
                            opened_at: "2026-09-01T22:40:03Z"
                        orders: []
                      - account_id: acc_2z8w4p
                        vps_id: vps_7f3k2m
                        mt5_login: 51234568
                        mt5_server: ICMarketsSC-MT5-2
                        broker: IC Markets
                        currency: USD
                        leverage: 500
                        type: real
                        terminal: { connected: true, build: 5120, trade_allowed: true, last_tick_at: "2026-09-02T10:15:05Z" }
                        balance: 5000.00
                        equity: 5000.00
                        margin: 0
                        free_margin: 5000.00
                        margin_level: null
                        floating_pnl: 0
                        as_of: "2026-09-02T10:15:07Z"
