  /v1/accounts/{account_id}:
    get:
      tags: [State]
      operationId: getAccount
      summary: Live state of one account
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ClientIdQuery"
      responses:
        "200":
          description: Account state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountState" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/accounts/{account_id}/history:
    get:
      tags: [History]
      operationId: getAccountHistory
      summary: Closed deals with per-EA attribution
      description: |
        Deals from the terminal's history, each mapped to `ea_id` / `instance_id`
        via magic number (and order comment as a fallback). Reporting and
        analytics are the caller's job; this endpoint exists so that attribution
        is done once, in the layer that knows which magic belongs to which EA.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: Inclusive lower bound on deal time. Default 7 days ago.
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: Exclusive upper bound. Default now.
        - name: ea_id
          in: query
          schema: { type: string }
        - name: instance_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Deal page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/accounts/{account_id}/commands:
    post:
      tags: [Commands]
      operationId: createCommand
      summary: Create a command (start / stop / set_risk / set_param / restart)
      description: |
        Validates the request against the catalog and the client's whitelist,
        then queues it for the VPS agent. Returns `202 Accepted` with a
        `command_id` to poll. Validation failures return `422` immediately with
        a machine-readable code and a human-readable message.

        Set `dry_run: true` to get the full validation result and the exact
        before → after diff **without** queuing anything (`200`). This is the
        recommended way to build a confirmation step: show the user the dry-run
        `summary` and `diff`, then send the real command.

        A command is refused with `409 CONFLICT` while another command is still
        in flight for the same instance.

        Send an `Idempotency-Key` header to make retries safe: the same key with
        the same body within 24 h returns the original command instead of
        creating a new one.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandCreate" }
            examples:
              startEa:
                summary: Add Night Hunter Pro with medium risk
                value:
                  client_id: "ea-cust-1042"
                  type: start_ea
                  requested_by: "edgard"
                  reason: "User asked: add Night Hunter Pro with medium risk"
                  params:
                    ea_id: night_hunter_pro
                    preset: medium
              stopEa:
                summary: Stop Waka Waka (soft – no new grids, keep managing open basket)
                value:
                  client_id: "ea-cust-1042"
                  type: stop_ea
                  requested_by: "edgard"
                  params:
                    instance_id: inst_a1b2c3
                    mode: soft
              setRisk:
                summary: Switch Perceptrader to low risk
                value:
                  client_id: "ea-cust-1042"
                  type: set_risk
                  requested_by: "edgard"
                  params:
                    instance_id: inst_d4e5f6
                    preset: low
              setParam:
                summary: Restart Night Hunter with MaxSpread 15
                value:
                  client_id: "ea-cust-1042"
                  type: set_param
                  requested_by: "edgard"
                  params:
                    instance_id: inst_g7h8i9
                    inputs:
                      MaximumSpread: 15
              dryRun:
                summary: Preview a change without applying it
                value:
                  client_id: "ea-cust-1042"
                  type: set_param
                  dry_run: true
                  params:
                    instance_id: inst_g7h8i9
                    inputs:
                      MaximumSpread: 15
      responses:
        "202":
          description: Command accepted and queued.
          headers:
            Location:
              description: URL to poll.
              schema: { type: string, examples: ["/v1/commands/cmd_01J6X0Q4M9?client_id=ea-cust-1042"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
              examples:
                queued:
                  value:
                    command_id: cmd_01J6X0Q4M9
                    client_id: "ea-cust-1042"
                    account_id: acc_9q1x7d
                    type: set_param
                    status: queued
                    summary: "Set MaximumSpread 10 → 15 on Night Hunter Pro (EURUSD) — EA will restart"
                    requested:
                      instance_id: inst_g7h8i9
                      inputs: { MaximumSpread: 15 }
                    resolved:
                      ea_id: night_hunter_pro
                      ea_name: Night Hunter Pro
                      instance_id: inst_g7h8i9
                      symbol: EURUSD
                      restarts_ea: true
                      open_positions_at_request: 1
                      diff:
                        - { name: MaximumSpread, label: "Maximum Spread, in pips", was: 10, now: 15 }
                    result: null
                    error: null
                    timeline:
                      - { status: queued, at: "2026-09-02T10:16:00Z" }
                    created_at: "2026-09-02T10:16:00Z"
                    updated_at: "2026-09-02T10:16:00Z"
                    completed_at: null
                    expires_at: "2026-09-02T10:26:00Z"
                    requested_by: "edgard"
        "200":
          description: Dry run – validated, nothing queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandPreview" }
              examples:
                preview:
                  value:
                    valid: true
                    type: set_param
                    account_id: acc_9q1x7d
                    summary: "Set MaximumSpread 10 → 15 on Night Hunter Pro (EURUSD) — EA will restart"
                    resolved:
                      ea_id: night_hunter_pro
                      ea_name: Night Hunter Pro
                      instance_id: inst_g7h8i9
                      symbol: EURUSD
                      restarts_ea: true
                      open_positions_at_request: 1
                      diff:
                        - { name: MaximumSpread, label: "Maximum Spread, in pips", was: 10, now: 15 }
                    requires_confirmation: false
                    warnings:
                      - "The EA will restart; 1 open position will be re-adopted by the EA (restart safety: verified)."
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Another command is in flight for this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                conflict:
                  value:
                    error:
                      code: CONFLICT
                      message: "Command cmd_01J6X0Q4M9 (set_param) is still running on this instance. Wait for it to finish or cancel it."
                      details: { in_flight_command_id: cmd_01J6X0Q4M9 }
                      retryable: true
                      hint: "Poll GET /v1/commands/cmd_01J6X0Q4M9 and retry once it is terminal."
        "422":
          description: Validation failed (whitelist, range, restart safety, unknown preset…).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                outOfRange:
                  value:
                    error:
                      code: PARAM_OUT_OF_RANGE
                      message: "MaximumSpread must be between 0.5 and 50 (got 150)."
                      details: { name: MaximumSpread, value: 150, min: 0.5, max: 50 }
                      retryable: false
                      hint: "Ask the user for a value within the allowed range."
                notChangeable:
                  value:
                    error:
                      code: PARAM_NOT_CHANGEABLE
                      message: "TradeDistance is not on the list of parameters that can be changed for Perceptrader AI."
                      details: { name: TradeDistance, changeable: [AllowOpeningNewGrid, MaximumSpread, MaximumTrades, "..."] }
                      retryable: false
                      hint: "Offer one of the changeable parameters instead, or explain that this one is locked."
                restartUnsafe:
                  value:
                    error:
                      code: RESTART_UNSAFE
                      message: "Waka Waka EA has 3 open positions and its restart safety is not verified. Changing parameters would restart the EA and could orphan the basket."
                      details: { instance_id: inst_a1b2c3, open_positions: 3, restart_safety: untested }
                      retryable: false
                      hint: "Suggest waiting until the basket closes, or a soft stop."
        "429": { $ref: "#/components/responses/RateLimited" }

    get:
      tags: [Commands]
      operationId: listCommands
      summary: Recent commands on an account (audit trail)
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CommandStatus" }
        - name: instance_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Command page
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items: { $ref: "#/components/schemas/Command" }
                  next_cursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/commands/{command_id}:
    get:
      tags: [Commands]
      operationId: getCommand
      summary: Poll a command
      description: |
        Returns the command with its current status. Pass `wait` (seconds, max 30)
        to long-poll: the server holds the response until the command reaches a
        terminal status or the wait elapses, so an LLM agent needs one call
        instead of a polling loop.

        Terminal statuses: `succeeded`, `failed`, `rejected`, `expired`, `cancelled`.
      parameters:
        - $ref: "#/components/parameters/CommandId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - name: wait
          in: query
          description: Long-poll for up to this many seconds.
          schema: { type: integer, minimum: 0, maximum: 30, default: 0 }
      responses:
        "200":
          description: Command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
              examples:
                succeeded:
                  value:
                    command_id: cmd_01J6X0Q4M9
                    client_id: "ea-cust-1042"
                    account_id: acc_9q1x7d
                    type: set_param
                    status: succeeded
                    summary: "MaximumSpread 10 → 15 applied on Night Hunter Pro (EURUSD); EA restarted and re-adopted 1 position"
                    requested:
                      instance_id: inst_g7h8i9
                      inputs: { MaximumSpread: 15 }
                    resolved:
                      ea_id: night_hunter_pro
                      ea_name: Night Hunter Pro
                      instance_id: inst_g7h8i9
                      symbol: EURUSD
                      restarts_ea: true
                      open_positions_at_request: 1
                      diff:
                        - { name: MaximumSpread, label: "Maximum Spread, in pips", was: 10, now: 15 }
                    result:
                      observed:
                        instance_status: running
                        inputs: { MaximumSpread: 15 }
                        open_positions: 1
                        pending_orders: 2
                        observed_at: "2026-09-02T10:16:09Z"
                      reconciled: true
                      notes: []
                    error: null
                    timeline:
                      - { status: queued, at: "2026-09-02T10:16:00Z" }
                      - { status: dispatched, at: "2026-09-02T10:16:03Z" }
                      - { status: running, at: "2026-09-02T10:16:04Z", note: "template applied" }
                      - { status: succeeded, at: "2026-09-02T10:16:09Z" }
                    created_at: "2026-09-02T10:16:00Z"
                    updated_at: "2026-09-02T10:16:09Z"
                    completed_at: "2026-09-02T10:16:09Z"
                    expires_at: "2026-09-02T10:26:00Z"
                    requested_by: "edgard"
                failed:
                  value:
                    command_id: cmd_01J6X0R7ZZ
                    client_id: "ea-cust-1042"
                    account_id: acc_9q1x7d
                    type: start_ea
                    status: failed
                    summary: "Could not start Night Hunter Pro on EURUSD: the terminal reported that the EA file is missing"
                    requested: { ea_id: night_hunter_pro, preset: medium }
                    resolved:
                      ea_id: night_hunter_pro
                      ea_name: Night Hunter Pro
                      instance_id: inst_g7h8i9
                      symbol: EURUSD
                      restarts_ea: false
                      open_positions_at_request: 0
                      diff: []
                    result:
                      observed: { instance_status: stopped, inputs: {}, open_positions: 0, pending_orders: 0, observed_at: "2026-09-02T10:20:05Z" }
                      reconciled: false
                      notes: ["ChartOpen succeeded, ChartApplyTemplate failed: expert 'NightHunterPro.ex5' not found in MQL5/Experts"]
                    error:
                      code: EA_NOT_INSTALLED
                      message: "Night Hunter Pro is not installed in this terminal (NightHunterPro.ex5 missing)."
                      details: { file: NightHunterPro.ex5 }
                      retryable: false
                      hint: "Tell the user the EA needs to be installed on the VPS first."
                    timeline:
                      - { status: queued, at: "2026-09-02T10:20:00Z" }
                      - { status: dispatched, at: "2026-09-02T10:20:02Z" }
                      - { status: running, at: "2026-09-02T10:20:03Z" }
                      - { status: failed, at: "2026-09-02T10:20:05Z" }
                    created_at: "2026-09-02T10:20:00Z"
                    updated_at: "2026-09-02T10:20:05Z"
                    completed_at: "2026-09-02T10:20:05Z"
                    expires_at: "2026-09-02T10:30:00Z"
                    requested_by: "edgard"
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/commands/{command_id}/cancel:
    post:
      tags: [Commands]
      operationId: cancelCommand
      summary: Cancel a queued command
      description: Only commands in `queued` status can be cancelled. Once dispatched to the agent the command runs to completion.
      parameters:
        - $ref: "#/components/parameters/CommandId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  allOf: [{ $ref: "#/components/schemas/ClientId" }]
                  description: Required with a tenant key; optional with a client key.
                reason: { type: string }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "409":
          description: Command is no longer cancellable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/backtests:
    post:
      tags: [Backtests (v2)]
      operationId: runBacktest
      x-status: v2
      summary: "(v2) Run a Strategy Tester backtest of an EA"
      description: |
        **Not available in the pilot.** Specified so that the command shape is
        agreed early; returns `501 NOT_IMPLEMENTED` until v2.

        Runs the MT5 Strategy Tester headlessly on a dedicated tester pool —
        never on the client's live VPS, because the tester saturates CPU and
        would disturb live execution. Behaves like every other command:
        `202` + `command_id`, then poll `GET /v1/commands/{command_id}`
        (runs take minutes). On success `result.backtest` carries the metrics
        and a link to the full report.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BacktestCreate" }
            examples:
              waka:
                value:
                  client_id: "ea-cust-1042"
                  ea_id: waka_waka
                  preset: medium
                  symbol: AUDNZD
                  timeframe: M15
                  from: "2026-01-01"
                  to: "2026-08-31"
                  deposit: 10000
                  currency: USD
                  leverage: 500
                  tick_model: every_tick_real
                  requested_by: edgard
      responses:
        "202":
          description: Backtest queued on the tester pool.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "501":
          description: Not implemented in this version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        Two kinds of keys, both issued by the operator per tenant:

        * **Client key** (recommended for anything acting on behalf of a user) –
          bound to one `client_id`. The client is derived from the key;
          `client_id` may be omitted in requests, and if it is sent and differs
          from the key's client the request fails with `403 CLIENT_MISMATCH`.
          A bug in the caller can therefore never reach another customer.
        * **Tenant key** – may address any client registered for the tenant.
          `client_id` is required on every call (`400 VALIDATION_FAILED` if
          missing, `403 FORBIDDEN` if the client is not the tenant's). Intended
          for backend/admin use only; must never reach a browser or a model.

        Keys are rotated via the operator, not via the API.

  parameters:
    ClientIdPath:
      name: client_id
      in: path
      required: true
      description: With a client key this must be the key's own client (`403 CLIENT_MISMATCH` otherwise).
      schema: { $ref: "#/components/schemas/ClientId" }
    ClientIdQuery:
      name: client_id
      in: query
      required: false
      description: |
        The caller's own identifier for the end customer. Required with a tenant key; optional with a
        client key (must match the key's client when present). Every resource is checked against it.
      schema: { $ref: "#/components/schemas/ClientId" }
    ClientIdQueryOptional:
      name: client_id
      in: query
      required: false
      description: Optional on catalog endpoints; when given, the response is limited to what this client is licensed to use.
      schema: { $ref: "#/components/schemas/ClientId" }
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { type: string, pattern: "^acc_[a-z0-9]{6,}$", examples: [acc_9q1x7d] }
    CommandId:
      name: command_id
      in: path
      required: true
      schema: { type: string, pattern: "^cmd_[A-Z0-9]{10,}$", examples: [cmd_01J6X0Q4M9] }
    EaId:
      name: ea_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EaId" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
      description: Client-chosen key. Same key + same body within 24 h returns the original command.

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The API key may not act for this client (`FORBIDDEN` – not the tenant's client; `CLIENT_MISMATCH` – client key used with another client_id).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource does not exist or does not belong to `client_id`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ------------------------------------------------------------------ ids
    ClientId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9._:-]+$"
      description: Opaque identifier of the end customer, owned by the integrating platform.
      examples: ["ea-cust-1042"]
    EaId:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,63}$"
      description: Catalog slug. Stable; never renamed.
      examples: [waka_waka, night_hunter_pro, perceptrader_ai, news_catcher_pro]
    InstanceId:
      type: string
      pattern: "^inst_[a-z0-9]{6,}$"
      examples: [inst_a1b2c3]
    Timeframe:
      type: string
      enum: [M1, M5, M15, M30, H1, H4, D1]

    # ------------------------------------------------------------------ errors
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          description: Human-readable, safe to show to the end user verbatim.
        details:
          type: object
          additionalProperties: true
          description: Machine-readable specifics (parameter name, limits, ids).
        retryable:
          type: boolean
          description: Whether the same request may succeed later without changes.
        hint:
          type: string
          description: Suggested next step, phrased for an LLM agent.
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - CLIENT_MISMATCH
        - NOT_FOUND
        - RATE_LIMITED
        - CONFLICT
        - EA_NOT_IN_CATALOG
        - EA_NOT_APPROVED
        - EA_NOT_INSTALLED
        - SYMBOL_NOT_ALLOWED
        - PRESET_UNKNOWN
        - PARAM_UNKNOWN
        - PARAM_NOT_CHANGEABLE
        - PARAM_OUT_OF_RANGE
        - PARAM_TYPE_MISMATCH
        - INSTANCE_NOT_FOUND
        - INSTANCE_LIMIT
        - RESTART_UNSAFE
        - UNSUPPORTED_MODE
        - AGENT_OFFLINE
        - TERMINAL_NOT_CONNECTED
        - TERMINAL_AUTH_FAILED
        - TRADING_DISABLED
        - TEMPLATE_APPLY_FAILED
        - COMMAND_TIMEOUT
        - COMMAND_NOT_CANCELLABLE
        - RECONCILE_MISMATCH
        - INTERNAL
      description: |
        * `VALIDATION_FAILED` (400) malformed body / missing field.
        * `UNAUTHORIZED` (401), `FORBIDDEN` (403), `CLIENT_MISMATCH` (403, client key used with a different
          `client_id`), `NOT_FOUND` (404), `RATE_LIMITED` (429), `CONFLICT` (409).
        * `EA_NOT_IN_CATALOG`, `EA_NOT_APPROVED`, `SYMBOL_NOT_ALLOWED`, `PRESET_UNKNOWN`,
          `PARAM_UNKNOWN`, `PARAM_NOT_CHANGEABLE`, `PARAM_OUT_OF_RANGE`, `PARAM_TYPE_MISMATCH`,
          `INSTANCE_NOT_FOUND`, `INSTANCE_LIMIT`, `RESTART_UNSAFE`, `UNSUPPORTED_MODE` (422) – refused before queuing.
        * `AGENT_OFFLINE`, `TERMINAL_NOT_CONNECTED`, `TERMINAL_AUTH_FAILED`, `TRADING_DISABLED` – refused
          before queuing (422) when the account's `status` shows the terminal could not execute (see
          `AccountStatus`); `AGENT_OFFLINE` also appears in `Command.error` of an `expired` command.
        * `EA_NOT_INSTALLED`, `TEMPLATE_APPLY_FAILED`, `COMMAND_TIMEOUT`, `RECONCILE_MISMATCH` – reported in
          `Command.error` of a `failed` command.
        * `INTERNAL` (500).

    # ------------------------------------------------------------------ catalog
    Preset:
      type: object
      required: [id, label]
      properties:
        id: { type: string, examples: [low, medium, high] }
        label: { type: string }
        description: { type: string }
    EaSummary:
      type: object
      required: [ea_id, name, category, status, restart_safety, supports_soft_stop, symbols_allowed, presets]
      properties:
        ea_id: { $ref: "#/components/schemas/EaId" }
        name: { type: string }
        vendor: { type: string }
        version: { type: [string, "null"] }
        category: { type: string, enum: [grid, scalper, news, trend, breakout, other] }
        description: { type: string }
        status:
          type: string
          enum: [draft, reviewed, approved, retired]
          description: Only `approved` EAs can be started on real accounts.
        restart_safety:
          type: string
          enum: [untested, verified, conditional, unsafe]
          description: Whether re-applying the template while positions are open is known to be safe. Parameter changes on instances with open positions require `verified` (or `conditional` with its conditions met).
        supports_soft_stop:
          type: boolean
          description: "The EA has a 'no new trades' input, so `stop_ea` with `mode: soft` is available."
        symbols_allowed:
          type: array
          items: { type: string }
        presets:
          type: array
          items: { $ref: "#/components/schemas/Preset" }
        default_preset: { type: [string, "null"] }
    EaParameter:
      type: object
      required: [name, type, default, changeable, requires_confirmation]
      properties:
        name:
          type: string
          description: Exact input variable name. Use this in `set_param`.
        label: { type: string, description: Name shown in the terminal's Inputs dialog. }
        description: { type: string }
        type: { type: string, enum: [bool, int, double, string, csv, enum] }
        default: { description: Effective default (from the base set file, not necessarily the vendor's compiled default). }
        group: { type: string }
        changeable: { type: boolean }
        constraints:
          type: object
          description: Present when `changeable` is true.
          properties:
            min: { type: number }
            max: { type: number }
            step: { type: number }
            allowed: { type: array, items: {} }
            subset_of:
              type: string
              description: For csv inputs – every value must come from this list (e.g. `symbols_allowed`).
        enum_labels:
          type: object
          additionalProperties: { type: string }
          description: Index → label for enum inputs.
        requires_confirmation:
          type: boolean
          description: Changing this affects risk or exposure; the caller should confirm with the user first. Advisory – the server does not block.
    EaDetail:
      allOf:
        - $ref: "#/components/schemas/EaSummary"
        - type: object
          required: [parameters]
          properties:
            parameters:
              type: array
              items: { $ref: "#/components/schemas/EaParameter" }
            notes: { type: string }

    # ------------------------------------------------------------------ provisioning
    VpsCreate:
      type: object
      properties:
        client_id:
          allOf: [{ $ref: "#/components/schemas/ClientId" }]
          description: Optional; if present it must equal the path parameter.
        external_ref:
          type: string
          maxLength: 128
          description: Your own id for this VPS (e.g. the hosting provider's server id). Returned in state as `vps.external_ref`.
        label:
          type: string
          maxLength: 128
          description: Free text shown in state under `host.label`.
    VpsProvisioned:
      type: object
      required: [vps_id, client_id, enroll_token, status, created_at]
      properties:
        vps_id: { type: string, examples: [vps_7f3k2m] }
        client_id: { $ref: "#/components/schemas/ClientId" }
        external_ref: { type: [string, "null"] }
        enroll_token:
          type: string
          description: One-time token for the agent configuration on that machine. Shown only in this response.
          examples: [enr_5Kz…]
        status: { type: string, enum: [offline] }
        created_at: { type: string, format: date-time }
        instructions: { type: string }

    # ------------------------------------------------------------------ state
    ClientState:
      type: object
      required: [client_id, as_of, stale, vps, accounts]
      properties:
        client_id: { $ref: "#/components/schemas/ClientId" }
        as_of: { type: string, format: date-time }
        stale: { type: boolean }
        vps:
          type: array
          items: { $ref: "#/components/schemas/VpsState" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountState" }
    VpsState:
      type: object
      required: [vps_id, status, last_seen]
      properties:
        vps_id: { type: string, examples: [vps_7f3k2m] }
        external_ref:
          type: [string, "null"]
          description: The integrating platform's own id for this VPS (e.g. the hosting provider's server id), given at enrolment. Null when not provided.
          examples: [VPS-3391-LDN]
        status:
          type: string
          enum: [online, offline, degraded, decommissioned]
          description: |
            `degraded` = the agent reports but something is wrong (see `host.auth_error` etc.);
            `decommissioned` = switched off by the operator, the agent has stopped.
        machine_bound:
          type: boolean
          description: The agent key of this VPS is bound to a machine fingerprint (true for every agent enrolled since 0.2.0).
        agent_version: { type: string }
        last_seen: { type: string, format: date-time }
        host:
          type: object
          properties:
            hostname: { type: string }
            os: { type: string }
            cpu_pct: { type: number }
            mem_pct: { type: number }
            disk_free_gb: { type: number }
            uptime_s: { type: integer }
        terminals: { type: integer, description: Number of MT5 terminals managed on this VPS. }
    TerminalState:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean, description: Terminal has a live connection to the broker server. }
        build: { type: [integer, "null"] }
        trade_allowed: { type: [boolean, "null"], description: AutoTrading enabled in the terminal. }
        last_tick_at: { type: [string, "null"], format: date-time }
        disconnected_since: { type: [string, "null"], format: date-time, description: Start of the current outage, if any. }
        previous_build: { type: [integer, "null"], description: Build the terminal ran before its last update (MT5 LiveUpdate applies at a restart). }
        build_changed_at: { type: [string, "null"], format: date-time, description: When the build change was first observed. }
    AccountStatus:
      type: string
      enum: [ok, degraded, disconnected, auth_failed, unknown]
      description: |
        * `ok` – terminal connected, AutoTrading on, agent reporting.
        * `degraded` – connected but something needs attention (`status_reason`): AutoTrading off, a
          connection blip under a minute, manager EA silent.
        * `disconnected` – no broker connection for over a minute. The agent restarts the terminal
          if the outage lasts (default after 5 min, at most every 15 min).
        * `auth_failed` – the broker rejected the login; the agent does **not** restart in this case
          (credentials need attention). Commands are refused with `TERMINAL_AUTH_FAILED`.
        * `unknown` – the agent has not reported within the freshness window (`stale: true`).
        Commands on an account that is not `ok` (or `degraded` with AutoTrading on) are refused
        before queuing: `AGENT_OFFLINE`, `TERMINAL_NOT_CONNECTED`, `TERMINAL_AUTH_FAILED`,
        `TRADING_DISABLED` (stop_ea is still allowed with AutoTrading off).
    AccountState:
      type: object
      required: [account_id, vps_id, mt5_login, mt5_server, currency, status, terminal, as_of, stale, instances]
      properties:
        account_id: { type: string, examples: [acc_9q1x7d] }
        client_id: { $ref: "#/components/schemas/ClientId" }
        vps_id: { type: string }
        mt5_login: { type: integer }
        mt5_server: { type: string }
        broker: { type: string }
        name: { type: string, description: Account holder name as reported by the terminal. }
        currency: { type: string }
        leverage: { type: integer }
        type: { type: string, enum: [demo, real, contest] }
        status: { $ref: "#/components/schemas/AccountStatus" }
        status_reason: { type: [string, "null"], description: Human-readable explanation when status is not `ok`; safe to show to the user. }
        terminal: { $ref: "#/components/schemas/TerminalState" }
        balance: { type: number }
        equity: { type: number }
        margin: { type: number }
        free_margin: { type: number }
        margin_level: { type: [number, "null"] }
        floating_pnl: { type: number }
        as_of: { type: string, format: date-time }
        stale: { type: boolean }
        instances:
          type: array
          items: { $ref: "#/components/schemas/Instance" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        orders:
          type: array
          items: { $ref: "#/components/schemas/PendingOrder" }
    InstanceStatus:
      type: string
      enum: [starting, running, paused, stopping, stopped, error, unknown]
      description: |
        `paused` = on the chart but new trades disallowed (soft stop). `unknown` = the agent
        cannot currently observe the chart (terminal restarting, agent reconnecting).
    Instance:
      type: object
      required: [instance_id, ea_id, ea_name, status, symbol, timeframe, inputs]
      properties:
        instance_id: { $ref: "#/components/schemas/InstanceId" }
        ea_id: { $ref: "#/components/schemas/EaId" }
        ea_name: { type: string }
        status: { $ref: "#/components/schemas/InstanceStatus" }
        symbol: { type: string, description: Chart symbol. Multi-symbol EAs trade their own list; see `inputs`. }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        preset:
          type: [string, "null"]
          description: Preset last applied, or null when inputs were set individually.
        uid: { type: [integer, "null"], description: Instance number passed to the EA (UID input) where applicable. }
        inputs:
          type: object
          additionalProperties: {}
          description: Effective caller-visible inputs (hidden inputs omitted).
        magic:
          type: [integer, "null"]
          description: |
            Effective magic number of this running copy, read back from the EA's inputs on the
            terminal. Null when the EA does not expose its magic as an input and the catalog has no
            fixed value for it.
        magic_default:
          type: [integer, "null"]
          description: The catalog value for the same input (vendor default), for comparison.
        magic_changed:
          type: boolean
          description: |
            `magic` differs from `magic_default` – someone edited the magic number in the terminal.
            Reporting keyed on catalog magic numbers would silently lose this instance's trades;
            use `magic` (or `magic_numbers`) instead.
        magic_numbers:
          type: array
          items: { type: integer }
          description: Magic numbers observed on positions/deals attributed to this instance.
        started_at: { type: [string, "null"], format: date-time }
        last_command_id: { type: [string, "null"] }
        open_positions: { type: integer }
        pending_orders: { type: integer }
        floating_pnl: { type: number }
        health:
          type: object
          properties:
            on_chart: { type: boolean, description: The EA is attached to its chart (observed, not assumed). }
            last_seen_on_chart: { type: [string, "null"], format: date-time }
            errors:
              type: array
              items: { type: string }
              description: Recent journal lines for this EA that look like errors.
    Position:
      type: object
      required: [ticket, symbol, type, volume, price_open, profit, magic]
      properties:
        ticket: { type: integer }
        symbol: { type: string }
        type: { type: string, enum: [buy, sell] }
        volume: { type: number }
        price_open: { type: number }
        price_current: { type: number }
        sl: { type: number }
        tp: { type: number }
        profit: { type: number }
        swap: { type: number }
        magic: { type: integer }
        comment: { type: string }
        ea_id: { type: [string, "null"] }
        instance_id: { type: [string, "null"] }
        opened_at: { type: string, format: date-time }
    PendingOrder:
      type: object
      required: [ticket, symbol, type, volume, price_open, magic]
      properties:
        ticket: { type: integer }
        symbol: { type: string }
        type: { type: string, enum: [buy_limit, sell_limit, buy_stop, sell_stop, buy_stop_limit, sell_stop_limit] }
        volume: { type: number }
        price_open: { type: number }
        sl: { type: number }
        tp: { type: number }
        magic: { type: integer }
        comment: { type: string }
        ea_id: { type: [string, "null"] }
        instance_id: { type: [string, "null"] }
        placed_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }

    # ------------------------------------------------------------------ history
    Deal:
      type: object
      required: [deal_id, time, symbol, type, entry, volume, price, profit, magic]
      properties:
        deal_id: { type: integer }
        order_id: { type: integer }
        position_id: { type: integer }
        time: { type: string, format: date-time }
        symbol: { type: string }
        type: { type: string, enum: [buy, sell, balance, credit, charge, correction, bonus, commission, other] }
        entry: { type: string, enum: [in, out, inout, out_by] }
        volume: { type: number }
        price: { type: number }
        profit: { type: number }
        swap: { type: number }
        commission: { type: number }
        fee: { type: number }
        magic: { type: integer }
        comment: { type: string }
        ea_id: { type: [string, "null"], description: Attributed via magic number, comment as fallback; null if unattributed (manual trade, unknown EA). }
        instance_id: { type: [string, "null"] }
    HistoryPage:
      type: object
      required: [account_id, deals, as_of]
      properties:
        account_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        deals:
          type: array
          items: { $ref: "#/components/schemas/Deal" }
        next_cursor: { type: [string, "null"] }
        as_of: { type: string, format: date-time }

    # ------------------------------------------------------------------ commands
    CommandType:
      type: string
      enum: [start_ea, stop_ea, set_risk, set_param, restart_ea, run_backtest]
      description: "`run_backtest` is v2 (tester pool, not the client's VPS); its commands have `account_id: null`."
    CommandStatus:
      type: string
      enum: [queued, dispatched, running, succeeded, failed, rejected, expired, cancelled]
      description: |
        `queued` → `dispatched` (agent picked it up) → `running` (template being applied) →
        `succeeded` | `failed`. `rejected` = failed validation after queuing (rare; normally 422 at creation).
        `expired` = agent did not pick it up before `expires_at` (VPS offline). `cancelled` = cancelled while queued.
    InputValue:
      description: A value for an EA input. Booleans as JSON booleans, numbers as JSON numbers, csv/strings as strings, enums as their integer index.
      oneOf:
        - { type: boolean }
        - { type: number }
        - { type: string }
    InputMap:
      type: object
      additionalProperties: { $ref: "#/components/schemas/InputValue" }
      description: Input variable name → value. Names are case-sensitive and must match `EaParameter.name`.
      examples:
        - { MaximumSpread: 15, NewsFilterEnabled: true }

    StartEaParams:
      type: object
      required: [ea_id]
      properties:
        ea_id: { $ref: "#/components/schemas/EaId" }
        preset:
          type: string
          description: Risk preset id from the catalog. Defaults to the EA's `default_preset`.
        symbol:
          type: string
          description: Chart symbol to attach to. Defaults to the EA's default. Must be in `symbols_allowed`.
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        inputs:
          $ref: "#/components/schemas/InputMap"
          description: Overrides applied on top of the preset. Whitelist applies.
    StopEaParams:
      type: object
      required: [instance_id]
      properties:
        instance_id: { $ref: "#/components/schemas/InstanceId" }
        mode:
          type: string
          enum: [soft, hard]
          default: soft
          description: |
            `soft` – disallow new trades; the EA stays on the chart and keeps managing its open positions until they close
            (instance status becomes `paused`). Requires `supports_soft_stop`.
            `hard` – remove the EA from the chart. Open positions and pending orders are left untouched and unmanaged.
        positions:
          type: string
          enum: [keep, close]
          default: keep
          description: "`close` – close all positions and pending orders attributed to this instance before stopping. Not enabled in the pilot; returns UNSUPPORTED_MODE."
    SetRiskParams:
      type: object
      required: [instance_id, preset]
      properties:
        instance_id: { $ref: "#/components/schemas/InstanceId" }
        preset: { type: string, description: Risk preset id from the catalog. }
    SetParamParams:
      type: object
      required: [instance_id, inputs]
      properties:
        instance_id: { $ref: "#/components/schemas/InstanceId" }
        inputs:
          $ref: "#/components/schemas/InputMap"
          description: One or more inputs to change. Everything else keeps its current value.
    RestartEaParams:
      type: object
      required: [instance_id]
      properties:
        instance_id: { $ref: "#/components/schemas/InstanceId" }
        inputs:
          $ref: "#/components/schemas/InputMap"
          description: Optional inputs to change during the restart. Same rules as `set_param`.

    CommandCreate:
      type: object
      required: [type, params]
      properties:
        client_id:
          allOf: [{ $ref: "#/components/schemas/ClientId" }]
          description: Required with a tenant key. Optional with a client key; if present it must match the key's client.
        type: { $ref: "#/components/schemas/CommandType" }
        params:
          description: Type-specific parameters (see `type`).
          oneOf:
            - $ref: "#/components/schemas/StartEaParams"
            - $ref: "#/components/schemas/StopEaParams"
            - $ref: "#/components/schemas/SetRiskParams"
            - $ref: "#/components/schemas/SetParamParams"
            - $ref: "#/components/schemas/RestartEaParams"
        dry_run:
          type: boolean
          default: false
          description: Validate and compute the diff, do not queue. Response is `200 CommandPreview`.
        requested_by:
          type: string
          maxLength: 128
          description: Free-text actor for the audit trail, e.g. `edgard`, `user:5521`, `support:anna`.
        reason:
          type: string
          maxLength: 500
          description: Free-text reason, e.g. the user's message that triggered the command. Stored, shown in the audit trail.
        callback_url:
          type: string
          format: uri
          description: |
            Reserved for webhooks. Accepted and stored, but **not delivered in 0.x** – poll
            `GET /v1/commands/{command_id}?wait=30` instead. When webhooks ship, this URL will
            receive a signed POST with the final `Command` object; no schema change will be needed
            on the caller's side.
        ttl_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 600
          description: How long the command may wait for the agent before expiring.
    Diff:
      type: object
      required: [name, was, now]
      properties:
        name: { type: string }
        label: { type: string }
        was: {}
        now: {}
    Resolved:
      type: object
      description: What the server decided to apply after validation.
      required: [ea_id, ea_name, instance_id, symbol, restarts_ea, diff]
      properties:
        ea_id: { $ref: "#/components/schemas/EaId" }
        ea_name: { type: string }
        instance_id: { $ref: "#/components/schemas/InstanceId" }
        symbol: { type: string }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        preset: { type: [string, "null"] }
        restarts_ea: { type: boolean, description: True for every command except a hard stop of a stopped instance. }
        open_positions_at_request: { type: integer }
        diff:
          type: array
          items: { $ref: "#/components/schemas/Diff" }
          description: Input changes that will be applied (was → now). Empty for start and hard stop; a soft stop shows the kill-switch input.
    Observed:
      type: object
      description: What the agent saw on the terminal after executing.
      properties:
        instance_status: { $ref: "#/components/schemas/InstanceStatus" }
        inputs: { $ref: "#/components/schemas/InputMap" }
        open_positions: { type: integer }
        pending_orders: { type: integer }
        observed_at: { type: string, format: date-time }
    CommandResult:
      type: object
      required: [observed, reconciled, notes]
      properties:
        observed: { $ref: "#/components/schemas/Observed" }
        reconciled:
          type: boolean
          description: "True when `observed` matches `resolved`. A command with `reconciled: false` is `failed` with `RECONCILE_MISMATCH`."
        notes:
          type: array
          items: { type: string }
        backtest:
          oneOf:
            - $ref: "#/components/schemas/BacktestResult"
            - type: "null"
          description: Present only for `run_backtest` commands (v2).

    # ------------------------------------------------------------------ backtests (v2)
    BacktestCreate:
      type: object
      x-status: v2
      required: [client_id, ea_id, symbol, timeframe, from, to, deposit]
      properties:
        client_id: { $ref: "#/components/schemas/ClientId" }
        ea_id: { $ref: "#/components/schemas/EaId" }
        preset: { type: string, description: Risk preset; defaults to the EA's default preset. }
        inputs: { $ref: "#/components/schemas/InputMap" }
        symbol: { type: string }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        from: { type: string, format: date }
        to: { type: string, format: date }
        deposit: { type: number }
        currency: { type: string, default: USD }
        leverage: { type: integer, default: 100 }
        tick_model:
          type: string
          enum: [every_tick_real, every_tick, one_minute_ohlc, open_prices]
          default: every_tick_real
        broker_server:
          type: string
          description: Tester-pool history source. Defaults to the tenant's primary broker server.
        requested_by: { type: string, maxLength: 128 }
        reason: { type: string, maxLength: 500 }
        callback_url: { type: string, format: uri }
    BacktestResult:
      type: object
      x-status: v2
      required: [net_profit, max_drawdown_pct, profit_factor, trades, report_url]
      properties:
        net_profit: { type: number }
        gross_profit: { type: number }
        gross_loss: { type: number }
        max_drawdown_pct: { type: number, description: Maximal equity drawdown, percent. }
        max_drawdown_money: { type: number }
        profit_factor: { type: [number, "null"] }
        recovery_factor: { type: [number, "null"] }
        sharpe: { type: [number, "null"] }
        expected_payoff: { type: number }
        trades: { type: integer }
        win_rate_pct: { type: number }
        period: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
        report_url:
          type: string
          format: uri
          description: Full HTML report, served by the API for 30 days.
        history_quality_pct: { type: [number, "null"], description: Tester's modelling quality. }
    TimelineEntry:
      type: object
      required: [status, at]
      properties:
        status: { $ref: "#/components/schemas/CommandStatus" }
        at: { type: string, format: date-time }
        note: { type: string }
    Command:
      type: object
      required: [command_id, client_id, account_id, type, status, summary, requested, timeline, created_at, updated_at]
      properties:
        command_id: { type: string, examples: [cmd_01J6X0Q4M9] }
        client_id: { $ref: "#/components/schemas/ClientId" }
        account_id: { type: [string, "null"], description: "null for `run_backtest` (tester pool, not an account)." }
        type: { $ref: "#/components/schemas/CommandType" }
        status: { $ref: "#/components/schemas/CommandStatus" }
        summary:
          type: string
          description: One human-readable sentence describing the command and its current outcome. Safe to show to the end user.
        requested:
          type: object
          additionalProperties: true
          description: The `params` object exactly as received.
        resolved:
          oneOf:
            - $ref: "#/components/schemas/Resolved"
            - type: "null"
        result:
          oneOf:
            - $ref: "#/components/schemas/CommandResult"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/Error"
            - type: "null"
        timeline:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        requested_by: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
    CommandPreview:
      type: object
      required: [valid, type, account_id, summary, resolved, requires_confirmation, warnings]
      properties:
        valid: { type: boolean, const: true }
        type: { $ref: "#/components/schemas/CommandType" }
        account_id: { type: string }
        summary: { type: string }
        resolved: { $ref: "#/components/schemas/Resolved" }
        requires_confirmation:
          type: boolean
          description: True if any changed input is flagged `requires_confirmation`, or the command restarts an EA with open positions.
        warnings:
          type: array
          items: { type: string }
