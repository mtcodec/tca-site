  /v1/accounts/{account_id}:
    get:
      tags: [State]
      operationId: getAccount
      summary: Live state of one account
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ClientIdQuery"
      responses:
        "200":
          description: Account state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountState" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/accounts/{account_id}/history:
    get:
      tags: [History]
      operationId: getAccountHistory
      summary: Closed deals with per-EA attribution
      description: |
        Deals from the terminal's history, each mapped to `ea_id` / `instance_id`
        via magic number (and order comment as a fallback). Reporting and
        analytics are the caller's job; this endpoint exists so that attribution
        is done once, in the layer that knows which magic belongs to which EA.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: Inclusive lower bound on deal time. Default 7 days ago.
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: Exclusive upper bound. Default now.
        - name: ea_id
          in: query
          schema: { type: string }
        - name: instance_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Deal page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/accounts/{account_id}/equity:
    get:
      tags: [History]
      operationId: getEquityCurve
      summary: Balance / equity over time, with drawdown
      description: |
        Two sources. `samples` (default): balance and equity sampled about once a minute from the
        agent's reports (kept 90 days) — shows floating P&L and intraday drawdown. `deals`: the balance
        after every deal of the complete history (trades, deposits, withdrawals), reconstructed from
        the current balance — any period, balance only, the classic "balance curve". Points are
        downsampled to `step` seconds (default: about 400 points for the window). The summary carries
        start/end/min/max and the maximum drawdown in the window. Meant to be drawn as a chart by the
        caller's UI; the chat demo does exactly that.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - name: source
          in: query
          schema: { type: string, enum: [samples, deals], default: samples }
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: Default 7 days before `to` for `samples`; the first deal for `deals`.
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: Default now.
        - name: step
          in: query
          schema: { type: integer, minimum: 60, maximum: 86400 }
          description: Seconds per point.
      responses:
        "200":
          description: Equity curve
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EquityCurve" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/accounts/{account_id}/pnl:
    get:
      tags: [History]
      operationId: getPnl
      summary: Closed P&L grouped by EA, instance, symbol, day, hour of day or weekday
      description: |
        Closed results from the deal history (profit + swap + commission + fee of closing deals;
        deposits and withdrawals excluded), grouped, with win rate, profit factor, average result,
        the maximum drawdown of each group's cumulative curve, and the cumulative curves themselves.
        `hour` and `weekday` always return all 24 / 7 buckets (empty ones with zero deals), in the time
        zone of the deal timestamps (the broker's server time). Attribution to EAs is by magic number,
        as in `/history`.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: Default 30 days before `to`.
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: group
          in: query
          schema: { type: string, enum: [ea, instance, symbol, day, hour, weekday], default: ea }
      responses:
        "200":
          description: P&L report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PnlReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/accounts/{account_id}/commands:
    post:
      tags: [Commands]
      operationId: createCommand
      summary: Create a command (start / stop / set_risk / set_param / restart)
      description: |
        Validates the request against the catalog and the client's whitelist,
        then queues it for the VPS agent. Returns `202 Accepted` with a
        `command_id` to poll. Validation failures return `422` immediately with
        a machine-readable code and a human-readable message.

        Set `dry_run: true` to get the full validation result and the exact
        before → after diff **without** queuing anything (`200`). This is the
        recommended way to build a confirmation step: show the user the dry-run
        `summary` and `diff`, then send the real command.

        A command is refused with `409 CONFLICT` while another command is still
        in flight for the same instance.

        Send an `Idempotency-Key` header to make retries safe: the same key with
        the same body within 24 h returns the original command instead of
        creating a new one.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandCreate" }
            examples:
              startEa:
                summary: Add Lantern Scalper Pro with medium risk
                value:
                  client_id: "ea-cust-1042"
                  type: start_ea
                  requested_by: "edgard"
                  reason: "User asked: add Lantern Scalper Pro with medium risk"
                  params:
                    ea_id: lantern_scalper_pro
                    preset: medium
              stopEa:
                summary: Stop Tidepool Grid (soft – no new grids, keep managing open basket)
                value:
                  client_id: "ea-cust-1042"
                  type: stop_ea
                  requested_by: "edgard"
                  params:
                    instance_id: inst_a1b2c3
                    mode: soft
              setRisk:
                summary: Switch Lattice to low risk
                value:
                  client_id: "ea-cust-1042"
                  type: set_risk
                  requested_by: "edgard"
                  params:
                    instance_id: inst_d4e5f6
                    preset: low
              setParam:
                summary: Restart Lantern Scalper with MaxSpread 15
                value:
                  client_id: "ea-cust-1042"
                  type: set_param
                  requested_by: "edgard"
                  params:
                    instance_id: inst_g7h8i9
                    inputs:
                      MaximumSpread: 15
              dryRun:
                summary: Preview a change without applying it
                value:
                  client_id: "ea-cust-1042"
                  type: set_param
                  dry_run: true
                  params:
                    instance_id: inst_g7h8i9
                    inputs:
                      MaximumSpread: 15
      responses:
        "202":
          description: Command accepted and queued.
          headers:
            Location:
              description: URL to poll.
              schema: { type: string, examples: ["/v1/commands/cmd_01J6X0Q4M9?client_id=ea-cust-1042"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
              examples:
                queued:
                  value:
                    command_id: cmd_01J6X0Q4M9
                    client_id: "ea-cust-1042"
                    account_id: acc_9q1x7d
                    type: set_param
                    status: queued
                    summary: "Set MaximumSpread 10 → 15 on Lantern Scalper Pro (EURUSD) — EA will restart"
                    requested:
                      instance_id: inst_g7h8i9
                      inputs: { MaximumSpread: 15 }
                    resolved:
                      ea_id: lantern_scalper_pro
                      ea_name: Lantern Scalper Pro
                      instance_id: inst_g7h8i9
                      symbol: EURUSD
                      restarts_ea: true
                      open_positions_at_request: 1
                      diff:
                        - { name: MaximumSpread, label: "Maximum Spread, in pips", was: 10, now: 15 }
                    result: null
                    error: null
                    timeline:
                      - { status: queued, at: "2026-09-02T10:16:00Z" }
                    created_at: "2026-09-02T10:16:00Z"
                    updated_at: "2026-09-02T10:16:00Z"
                    completed_at: null
                    expires_at: "2026-09-02T10:26:00Z"
                    requested_by: "edgard"
        "200":
          description: Dry run – validated, nothing queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandPreview" }
              examples:
                preview:
                  value:
                    valid: true
                    type: set_param
                    account_id: acc_9q1x7d
                    summary: "Set MaximumSpread 10 → 15 on Lantern Scalper Pro (EURUSD) — EA will restart"
                    resolved:
                      ea_id: lantern_scalper_pro
                      ea_name: Lantern Scalper Pro
                      instance_id: inst_g7h8i9
                      symbol: EURUSD
                      restarts_ea: true
                      open_positions_at_request: 1
                      diff:
                        - { name: MaximumSpread, label: "Maximum Spread, in pips", was: 10, now: 15 }
                    requires_confirmation: false
                    warnings:
                      - "The EA will restart; 1 open position will be re-adopted by the EA (restart safety: verified)."
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Another command is in flight for this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                conflict:
                  value:
                    error:
                      code: CONFLICT
                      message: "Command cmd_01J6X0Q4M9 (set_param) is still running on this instance. Wait for it to finish or cancel it."
                      details: { in_flight_command_id: cmd_01J6X0Q4M9 }
                      retryable: true
                      hint: "Poll GET /v1/commands/cmd_01J6X0Q4M9 and retry once it is terminal."
        "422":
          description: Validation failed (whitelist, range, restart safety, unknown preset…).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                outOfRange:
                  value:
                    error:
                      code: PARAM_OUT_OF_RANGE
                      message: "MaximumSpread must be between 0.5 and 50 (got 150)."
                      details: { name: MaximumSpread, value: 150, min: 0.5, max: 50 }
                      retryable: false
                      hint: "Ask the user for a value within the allowed range."
                notChangeable:
                  value:
                    error:
                      code: PARAM_NOT_CHANGEABLE
                      message: "TradeDistance is not on the list of parameters that can be changed for Lattice AI."
                      details: { name: TradeDistance, changeable: [AllowOpeningNewGrid, MaximumSpread, MaximumTrades, "..."] }
                      retryable: false
                      hint: "Offer one of the changeable parameters instead, or explain that this one is locked."
                restartUnsafe:
                  value:
                    error:
                      code: RESTART_UNSAFE
                      message: "Tidepool Grid has 3 open positions and its restart safety is not verified. Changing parameters would restart the EA and could orphan the basket."
                      details: { instance_id: inst_a1b2c3, open_positions: 3, restart_safety: untested }
                      retryable: false
                      hint: "Suggest waiting until the basket closes, or a soft stop."
        "429": { $ref: "#/components/responses/RateLimited" }

    get:
      tags: [Commands]
      operationId: listCommands
      summary: Recent commands on an account (audit trail)
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CommandStatus" }
        - name: instance_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Command page
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items: { $ref: "#/components/schemas/Command" }
                  next_cursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/commands/{command_id}:
    get:
      tags: [Commands]
      operationId: getCommand
      summary: Poll a command
      description: |
        Returns the command with its current status. Pass `wait` (seconds, max 30)
        to long-poll: the server holds the response until the command reaches a
        terminal status or the wait elapses, so an LLM agent needs one call
        instead of a polling loop.

        Terminal statuses: `succeeded`, `failed`, `rejected`, `expired`, `cancelled`.
      parameters:
        - $ref: "#/components/parameters/CommandId"
        - $ref: "#/components/parameters/ClientIdQuery"
        - name: wait
          in: query
          description: Long-poll for up to this many seconds.
          schema: { type: integer, minimum: 0, maximum: 30, default: 0 }
      responses:
        "200":
          description: Command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
              examples:
                succeeded:
                  value:
                    command_id: cmd_01J6X0Q4M9
                    client_id: "ea-cust-1042"
                    account_id: acc_9q1x7d
                    type: set_param
                    status: succeeded
                    summary: "MaximumSpread 10 → 15 applied on Lantern Scalper Pro (EURUSD); EA restarted and re-adopted 1 position"
                    requested:
                      instance_id: inst_g7h8i9
                      inputs: { MaximumSpread: 15 }
                    resolved:
                      ea_id: lantern_scalper_pro
                      ea_name: Lantern Scalper Pro
                      instance_id: inst_g7h8i9
                      symbol: EURUSD
                      restarts_ea: true
                      open_positions_at_request: 1
                      diff:
                        - { name: MaximumSpread, label: "Maximum Spread, in pips", was: 10, now: 15 }
                    result:
                      observed:
                        instance_status: running
                        inputs: { MaximumSpread: 15 }
                        open_positions: 1
                        pending_orders: 2
                        observed_at: "2026-09-02T10:16:09Z"
                      reconciled: true
                      notes: []
                    error: null
                    timeline:
                      - { status: queued, at: "2026-09-02T10:16:00Z" }
                      - { status: dispatched, at: "2026-09-02T10:16:03Z" }
                      - { status: running, at: "2026-09-02T10:16:04Z", note: "template applied" }
                      - { status: succeeded, at: "2026-09-02T10:16:09Z" }
                    created_at: "2026-09-02T10:16:00Z"
                    updated_at: "2026-09-02T10:16:09Z"
                    completed_at: "2026-09-02T10:16:09Z"
                    expires_at: "2026-09-02T10:26:00Z"
                    requested_by: "edgard"
                failed:
                  value:
                    command_id: cmd_01J6X0R7ZZ
                    client_id: "ea-cust-1042"
                    account_id: acc_9q1x7d
                    type: start_ea
                    status: failed
                    summary: "Could not start Lantern Scalper Pro on EURUSD: the terminal reported that the EA file is missing"
                    requested: { ea_id: lantern_scalper_pro, preset: medium }
                    resolved:
                      ea_id: lantern_scalper_pro
                      ea_name: Lantern Scalper Pro
                      instance_id: inst_g7h8i9
                      symbol: EURUSD
                      restarts_ea: false
                      open_positions_at_request: 0
                      diff: []
                    result:
                      observed: { instance_status: stopped, inputs: {}, open_positions: 0, pending_orders: 0, observed_at: "2026-09-02T10:20:05Z" }
                      reconciled: false
                      notes: ["ChartOpen succeeded, ChartApplyTemplate failed: expert 'LanternScalperPro.ex5' not found in MQL5/Experts"]
                    error:
                      code: EA_NOT_INSTALLED
                      message: "Lantern Scalper Pro is not installed in this terminal (LanternScalperPro.ex5 missing)."
                      details: { file: LanternScalperPro.ex5 }
                      retryable: false
                      hint: "Tell the user the EA needs to be installed on the VPS first."
                    timeline:
                      - { status: queued, at: "2026-09-02T10:20:00Z" }
                      - { status: dispatched, at: "2026-09-02T10:20:02Z" }
                      - { status: running, at: "2026-09-02T10:20:03Z" }
                      - { status: failed, at: "2026-09-02T10:20:05Z" }
                    created_at: "2026-09-02T10:20:00Z"
                    updated_at: "2026-09-02T10:20:05Z"
                    completed_at: "2026-09-02T10:20:05Z"
                    expires_at: "2026-09-02T10:30:00Z"
                    requested_by: "edgard"
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/commands/{command_id}/cancel:
    post:
      tags: [Commands]
      operationId: cancelCommand
      summary: Cancel a queued command
      description: Only commands in `queued` status can be cancelled. Once dispatched to the agent the command runs to completion.
      parameters:
        - $ref: "#/components/parameters/CommandId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  allOf: [{ $ref: "#/components/schemas/ClientId" }]
                  description: Required with a tenant key; optional with a client key.
                reason: { type: string }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "409":
          description: Command is no longer cancellable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/backtests:
    post:
      tags: [Backtests (v2)]
      operationId: runBacktest
      summary: "Run a Strategy Tester backtest of an EA on the customer's VPS"
      description: |
        Runs the MT5 Strategy Tester on the customer's own VPS, in a second,
        isolated terminal instance next to the live terminals (below-normal
        priority, one core where possible, one test per VPS at a time). The
        same thing as a `run_backtest` command on the account, spelled out.

        **Consent.** The test costs CPU and memory on the customer's machine,
        so the first run of a client needs an explicit yes: a `dry_run` returns
        `requires_consent` and `consent_text` (the warning, with the VPS's
        cores and RAM); a real run without `consent: true` is refused with
        `422 CONSENT_REQUIRED`. Once given, the consent is remembered for the
        client.

        Behaves like every other command: `202` + `command_id`, then poll
        `GET /v1/commands/{command_id}` (runs take minutes to an hour). On
        success `result.backtest` carries the metrics and `result.report_url`
        the tester's full HTML report (`GET /v1/commands/{command_id}/report`).
        The sandbox tenant returns simulated metrics (`simulated: true`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BacktestCreate" }
            examples:
              tidepool:
                value:
                  client_id: "ea-cust-1042"
                  account_id: acc_9q1x7d
                  ea_id: tidepool_grid
                  preset: medium
                  symbol: AUDNZD
                  timeframe: M15
                  from: "2026-01-01"
                  to: "2026-08-31"
                  deposit: 10000
                  currency: USD
                  leverage: 500
                  tick_model: every_tick_real
                  consent: true
                  requested_by: edgard
      responses:
        "202":
          description: Backtest queued for the agent on the customer's VPS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "200":
          description: Dry run — the resolved plan, the consent status and the warnings; nothing queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandPreview" }
        "422":
          description: Validation failed, consent missing (`CONSENT_REQUIRED`), agent offline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Another backtest is still running on this VPS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/clients/{client_id}/chat-codes:
    post:
      tags: [Embedded chat]
      operationId: createChatCode
      summary: "Issue a chat code that embeds the AlgoHand assistant for this client"
      description: |
        The AlgoHand chat can live inside your own site or dashboard: as a widget
        (one `<script>` tag, a bubble in the corner) or in an iframe. Both need a
        **chat code** for the customer: mint one from your backend when the customer
        opens the page, pass it to the page, revoke it when they sign out (or let it
        expire). The code carries a client-scoped key, so the chat sees this client
        only and acts with your tenant's catalog and rules. The chat's LLM runs on
        AlgoHand's side.
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCodeCreate" }
            example: { label: "dashboard session 8f31", display_name: "Ana", ttl_hours: 24, lang: es }
      responses:
        "201":
          description: The code, the URLs and the widget snippet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/chat-codes/{code}:
    delete:
      tags: [Embedded chat]
      operationId: revokeChatCode
      summary: "Revoke a chat code (and the key behind it)"
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: client_id, in: query, required: false, schema: { $ref: "#/components/schemas/ClientId" } }
      responses:
        "200":
          description: The code with `revoked_at` set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/clients/{client_id}/eas:
    post:
      tags: [EA onboarding]
      operationId: createClientEa
      summary: "Onboard the customer's own EA: upload the .ex5, or point at one already on the VPS"
      description: |
        Two request shapes:

        * **Upload** — the raw `.ex5` as the request body (`Content-Type: application/octet-stream`)
          with `?filename=Name.ex5`. The file is stored encrypted on AlgoHand's side; the agent copies
          it into `MQL5\Experts\TCA` of every terminal on the customer's VPS (`install_ea` command),
          then reads its inputs on a throw-away chart with algo trading switched off for that chart
          (`discover_ea`, queued automatically), and a draft profile is prepared — labels, descriptions,
          categories, suggested ranges, presets, enum guesses (AI-assisted when configured).
        * **Already on the VPS** — JSON `{"from_vps": {"file": "Name.ex5", "path": "Experts\\…"}}`
          (from `on_vps` of the listing): nothing to upload, discovery is queued at once.

        Watch `status` on `GET …/eas/{custom_id}`: `uploaded → installed → discovered → drafted`.
        Then the customer reviews the draft (your assistant walks them through it: risk inputs first,
        dropdown option names the terminal cannot reveal, ranges, presets, symbols), `PATCH …/draft`
        stores the corrections and `POST …/confirm` activates the EA: it appears in `GET /v1/eas`
        **for this client only** with `ea_id = custom_id` and works with every command. Its restart
        safety starts `untested`: parameter changes while it has open positions are refused
        (`RESTART_UNSAFE`) until AlgoHand verifies it. Design: docs/EA_ONBOARDING_V2.md.
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
        - { name: filename, in: query, required: false, schema: { type: string }, description: "Upload only: the .ex5 file name (plain characters)." }
        - { name: source_url, in: query, required: false, schema: { type: string }, description: "Optional: the EA's vendor page or manual; improves the draft." }
        - { name: requested_by, in: query, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/json:
            schema: { $ref: "#/components/schemas/CustomEaFromVps" }
            example: { from_vps: { file: "GoldScalper.ex5", path: "Experts\\Vendor\\GoldScalper.ex5" }, source_url: "https://vendor.example/gold-scalper" }
      responses:
        "202":
          description: The custom EA record plus the command that was queued (`install_ea` for an upload, `discover_ea` otherwise).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomEaWithCommand" }
        "400":
          description: Not an .ex5, no `filename`, file too small.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413":
          description: File larger than the limit (10 MB by default).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: No VPS connected for the client (`AGENT_OFFLINE`), no logged-in terminal (`TERMINAL_NOT_CONNECTED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [EA onboarding]
      operationId: listClientEas
      summary: "The customer's own EAs and every .ex5 found on their VPS"
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
      responses:
        "200":
          description: Custom EAs with their onboarding status, and the expert files the agent sees under `MQL5\Experts`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomEaList" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/clients/{client_id}/eas/{custom_id}:
    get:
      tags: [EA onboarding]
      operationId: getClientEa
      summary: "One custom EA in full: discovered inputs, draft, journal, document once confirmed"
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
        - { name: custom_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The record with `parameters`, `draft`, `journal` and (confirmed) `document`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomEa" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [EA onboarding]
      operationId: deleteClientEa
      summary: "Remove a custom EA (and its uploaded file when nothing else uses it)"
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
        - { name: custom_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Removed. Running instances of the EA keep trading; they can no longer be reconfigured by chat.
          content:
            application/json:
              schema:
                type: object
                properties: { custom_id: { type: string }, deleted: { type: boolean } }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/clients/{client_id}/eas/{custom_id}/discover:
    post:
      tags: [EA onboarding]
      operationId: discoverClientEa
      summary: "Read the EA's inputs on the terminal (again)"
      description: |
        Queues a `discover_ea` command: the agent applies the EA on a throw-away chart with algo
        trading off for that chart, lets the terminal save the chart's template, reads every input
        name and default from it and closes the chart. Runs by itself after an upload; call it after
        a new build of the file, or when the first attempt failed (see `journal` for licence errors).
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
        - { name: custom_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoverEaBody" }
      responses:
        "202":
          description: Discovery queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomEaWithCommand" }
        "409":
          description: Another command is still in flight for this EA.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Not installed yet, no VPS or terminal available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/clients/{client_id}/eas/{custom_id}/draft:
    patch:
      tags: [EA onboarding]
      operationId: patchClientEaDraft
      summary: "Store the customer's corrections to the draft"
      description: |
        Everything is optional; only what is sent changes. Per input: `label`, `description`, `category`,
        `is_risk`, `changeable`, `hidden`, `requires_flat`, `min`, `max`, `step`, `allowed`,
        `enum_labels` (index → option name, exactly as the customer names them, in order) and `type`
        (`int` | `double` | `enum` — a template cannot tell 15 from 15.0). A dropdown input
        (`enum_candidate`) without confirmed `enum_labels` stays locked. Also `kill_switch`,
        `magic_input`, `symbols_allowed`, `default_symbol`, `default_timeframe`, `presets`,
        `default_preset`, `name`, `description`, `category`, `source_url`.
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
        - { name: custom_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EaDraftPatch" }
            example:
              inputs:
                LotMode: { enum_labels: { "0": "Fixed lot", "1": "Percent of balance", "2": "Martingale" }, allowed: [0, 1] }
                RiskPercent: { label: "Risk per trade %", max: 3 }
              symbols_allowed: [XAUUSD]
              default_timeframe: M5
      responses:
        "200":
          description: The record with the updated draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomEa" }
        "422":
          description: Unknown input name (`PARAM_UNKNOWN`), inputs not discovered yet (`EA_NOT_DISCOVERED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/esp/schema:
    get:
      tags: [EAs]
      summary: The EA Spec Protocol JSON Schema (public)
      operationId: getEspSchema
      security: []
      responses:
        '200':
          description: JSON Schema (draft 2020-12) of an ESP document.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /v1/esp/validate:
    post:
      tags: [EAs]
      summary: Validate an ESP document without an account
      operationId: validateEsp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  esp_version: { type: string }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        message: { type: string }
  /v1/eas/{ea_id}/spec:
    get:
      tags: [EAs]
      summary: ESP view of a catalog EA with derived permissions
      operationId: getEaSpec
      parameters:
        - { name: ea_id, in: path, required: true, schema: { type: string } }
        - { name: client_id, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: spec, permissions (per parameter), progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EspView' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/clients/{client_id}/eas/{custom_id}/spec:
    get:
      tags: [EAs]
      summary: The client's spec for their own EA (stored, else derived from the draft)
      operationId: getClientEaSpec
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string } }
        - { name: custom_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: spec, permissions, progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EspView' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [EAs]
      summary: Upload or update the EA spec (validated, cross-checked against discovery, trust-merged, signed)
      operationId: putClientEaSpec
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string } }
        - { name: custom_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                client_id: { type: string }
                spec: { type: object, additionalProperties: true, description: An ESP document (see /v1/esp/schema). }
                note: { type: string }
      responses:
        '200':
          description: The merged spec, rejected rows, permissions and progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EspView' }
        '409':
          description: SPEC_SHA_MISMATCH — the spec describes another build.
        '422':
          description: SPEC_INVALID (schema errors in details.errors) or EA_NOT_DISCOVERED.
  /v1/clients/{client_id}/eas/{custom_id}/confirm:
    post:
      tags: [EA onboarding]
      operationId: confirmClientEa
      summary: "Activate the EA in the client's catalog"
      description: |
        Builds the catalog document from the (patched) draft and makes the EA usable: `ea_id = custom_id`
        in `GET /v1/eas` (this client only), `start_ea` / `set_risk` / `set_param` / `stop_ea` /
        `run_backtest` as with any catalog EA, validated against the confirmed ranges. Needs at least
        one symbol in `symbols_allowed` and discovered inputs. Accepts the same body as the draft patch,
        applied first. Re-confirming after a later patch replaces the document.
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
        - { name: custom_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EaDraftPatch" }
      responses:
        "200":
          description: Confirmed; `document` carries the catalog entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomEa" }
        "422":
          description: Inputs not discovered, no symbols, or the profile is not a valid catalog entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/clients/{client_id}/support/tickets:
    post:
      tags: [Support]
      operationId: createClientSupportTicket
      summary: "Open a support ticket for this client (chat tool, partner backend)"
      description: |
        The ticket is bound to the client. The answer goes to the client's dashboard e-mail; for a client
        without a dashboard account pass `email`. Returns 202 with the ticket and a `link` to its page
        (for a client without a dashboard account the link carries an access token: pass it on to the
        customer, do not log it). The assistant answers within about a minute, or the ticket is escalated
        to the team; the customer gets both by e-mail.
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportTicketCreate" }
      responses:
        "202":
          description: Ticket opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [Support]
      operationId: listClientSupportTickets
      summary: "This client's tickets (newest first, up to 50)"
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
      responses:
        "200":
          description: Tickets without messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets: { type: array, items: { $ref: "#/components/schemas/SupportTicket" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/clients/{client_id}/alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: "The client's alert rules and the catalog of kinds"
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
      responses:
        "200":
          description: Rules and kinds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts: { type: array, items: { $ref: "#/components/schemas/Alert" } }
                  kinds: { type: object, additionalProperties: { type: object, properties: { scope: { type: string }, params: { type: array, items: { type: string } }, description: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Alerts]
      operationId: createAlert
      summary: "Create an alert rule"
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertCreate" }
      responses:
        "201":
          description: Created (status `armed`, or `waiting_agent` for price rules).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/clients/{client_id}/alerts/{alert_id}:
    get:
      tags: [Alerts]
      operationId: getAlert
      summary: "One rule with its last 20 notifications"
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
        - { name: alert_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The rule and its events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Alerts]
      operationId: updateAlert
      summary: "Pause / resume / edit a rule"
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
        - { name: alert_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [armed, paused] }
                text: { type: string }
                params: { type: object, additionalProperties: true }
                channels: { type: array, items: { type: string, enum: [telegram, email] } }
                repeat: { type: boolean }
                cooldown_s: { type: integer }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Alerts]
      operationId: deleteAlert
      summary: "Delete a rule"
      parameters:
        - { name: client_id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
        - { name: alert_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted.
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/support/tickets:
    post:
      tags: [Support]
      operationId: createPublicSupportTicket
      summary: "Open a support ticket without an account (website form)"
      description: |
        No authentication; throttled per address; `website` is a honeypot field that must stay empty.
        Returns 202 with the ticket and a `link` (ticket page with the visitor's access token, also sent
        by e-mail).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, message]
              properties:
                name: { type: string, maxLength: 128 }
                email: { type: string }
                subject: { type: string, maxLength: 256 }
                message: { type: string, maxLength: 8000 }
                lang: { type: string, enum: [en, ru, es] }
                website: { type: string, description: "Honeypot — leave empty." }
      responses:
        "202":
          description: Ticket opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/support/tickets/{ticket_id}:
    get:
      tags: [Support]
      operationId: getPublicSupportTicket
      summary: "A ticket with its messages, by access token"
      security: []
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: string } }
        - { name: c, in: query, required: true, schema: { type: string }, description: "The visitor's access token from the ticket link." }
      responses:
        "200":
          description: Ticket and messages (assistant drafts for the team are never included).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/support/tickets/{ticket_id}/reply:
    post:
      tags: [Support]
      operationId: replyPublicSupportTicket
      summary: "The customer adds a message"
      description: A reply to an assistant answer is answered again (or escalated); a reply on a ticket a person handles goes to that person.
      security: []
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: string } }
        - { name: c, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 8000 }
      responses:
        "200":
          description: The updated ticket with messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/commands/{command_id}/report:
    get:
      tags: [Backtests (v2)]
      operationId: getBacktestReport
      summary: "Full HTML report of a finished backtest"
      parameters:
        - { name: command_id, in: path, required: true, schema: { type: string } }
        - { name: client_id, in: query, required: false, schema: { $ref: "#/components/schemas/ClientId" } }
      responses:
        "200":
          description: The Strategy Tester's report as the terminal wrote it.
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        Two kinds of keys, both issued by the operator per tenant:

        * **Client key** (recommended for anything acting on behalf of a user) –
          bound to one `client_id`. The client is derived from the key;
          `client_id` may be omitted in requests, and if it is sent and differs
          from the key's client the request fails with `403 CLIENT_MISMATCH`.
          A bug in the caller can therefore never reach another customer.
        * **Tenant key** – may address any client registered for the tenant.
          `client_id` is required on every call (`400 VALIDATION_FAILED` if
          missing, `403 FORBIDDEN` if the client is not the tenant's). Intended
          for backend/admin use only; must never reach a browser or a model.

        Keys are rotated via the operator, not via the API.

  parameters:
    ClientIdPath:
      name: client_id
      in: path
      required: true
      description: With a client key this must be the key's own client (`403 CLIENT_MISMATCH` otherwise).
      schema: { $ref: "#/components/schemas/ClientId" }
    ClientIdQuery:
      name: client_id
      in: query
      required: false
      description: |
        The caller's own identifier for the end customer. Required with a tenant key; optional with a
        client key (must match the key's client when present). Every resource is checked against it.
      schema: { $ref: "#/components/schemas/ClientId" }
    ClientIdQueryOptional:
      name: client_id
      in: query
      required: false
      description: Optional on catalog endpoints; when given, the response is limited to what this client is licensed to use.
      schema: { $ref: "#/components/schemas/ClientId" }
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { type: string, pattern: "^acc_[a-z0-9]{6,}$", examples: [acc_9q1x7d] }
    CommandId:
      name: command_id
      in: path
      required: true
      schema: { type: string, pattern: "^cmd_[A-Z0-9]{10,}$", examples: [cmd_01J6X0Q4M9] }
    EaId:
      name: ea_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EaId" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
      description: Client-chosen key. Same key + same body within 24 h returns the original command.

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The API key may not act for this client (`FORBIDDEN` – not the tenant's client; `CLIENT_MISMATCH` – client key used with another client_id).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource does not exist or does not belong to `client_id`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    EspView:
      type: object
      properties:
        spec: { type: object, additionalProperties: true, description: The ESP document. }
        stored: { type: boolean }
        rejected:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              reason: { type: string }
        permissions:
          type: object
          properties:
            parameters: { type: object, additionalProperties: true }
            restart_with_open_positions: { type: boolean }
            restart_trust: { type: string }
            whitelist_version: { type: integer }
        progress:
          type: object
          properties:
            total: { type: integer }
            described: { type: integer }
            writable: { type: integer }
    # ------------------------------------------------------------------ ids
    ClientId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9._:-]+$"
      description: Opaque identifier of the end customer, owned by the integrating platform.
      examples: ["ea-cust-1042"]
    EaId:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,63}$"
      description: Catalog slug. Stable; never renamed.
      examples: [tidepool_grid, lantern_scalper_pro, lattice_ai, headline_runner]
    InstanceId:
      type: string
      pattern: "^inst_[a-z0-9]{6,}$"
      examples: [inst_a1b2c3]
    Timeframe:
      type: string
      enum: [M1, M5, M15, M30, H1, H4, D1]

    # ------------------------------------------------------------------ errors
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          description: Human-readable, safe to show to the end user verbatim.
        details:
          type: object
          additionalProperties: true
          description: Machine-readable specifics (parameter name, limits, ids).
        retryable:
          type: boolean
          description: Whether the same request may succeed later without changes.
        hint:
          type: string
          description: Suggested next step, phrased for an LLM agent.
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - CLIENT_MISMATCH
        - NOT_FOUND
        - RATE_LIMITED
        - CONFLICT
        - EA_NOT_IN_CATALOG
        - EA_NOT_APPROVED
        - EA_NOT_INSTALLED
        - SYMBOL_NOT_ALLOWED
        - PRESET_UNKNOWN
        - PARAM_UNKNOWN
        - PARAM_NOT_CHANGEABLE
        - PARAM_OUT_OF_RANGE
        - PARAM_TYPE_MISMATCH
        - INSTANCE_NOT_FOUND
        - INSTANCE_LIMIT
        - MAGIC_CONFLICT
        - RESTART_UNSAFE
        - UNSUPPORTED_MODE
        - AGENT_OFFLINE
        - TERMINAL_NOT_CONNECTED
        - TERMINAL_AUTH_FAILED
        - TRADING_DISABLED
        - TEMPLATE_APPLY_FAILED
        - COMMAND_TIMEOUT
        - COMMAND_NOT_CANCELLABLE
        - RECONCILE_MISMATCH
        - INTERNAL
      description: |
        * `VALIDATION_FAILED` (400) malformed body / missing field.
        * `UNAUTHORIZED` (401), `FORBIDDEN` (403), `CLIENT_MISMATCH` (403, client key used with a different
          `client_id`), `NOT_FOUND` (404), `RATE_LIMITED` (429), `CONFLICT` (409).
        * `EA_NOT_IN_CATALOG`, `EA_NOT_APPROVED`, `SYMBOL_NOT_ALLOWED`, `PRESET_UNKNOWN`,
          `PARAM_UNKNOWN`, `PARAM_NOT_CHANGEABLE`, `PARAM_OUT_OF_RANGE`, `PARAM_TYPE_MISMATCH`,
          `INSTANCE_NOT_FOUND`, `INSTANCE_LIMIT`, `MAGIC_CONFLICT`, `RESTART_UNSAFE`, `UNSUPPORTED_MODE` (422) – refused before queuing.
          `MAGIC_CONFLICT`: the new copy would trade with a magic number another running EA on the account already
          uses, so their trades could not be told apart; `details` carries `magic`, the other `instance_id`,
          the EA's `magic_input` and whether it is `changeable` (then pass a different value in `inputs`).
        * `AGENT_OFFLINE`, `TERMINAL_NOT_CONNECTED`, `TERMINAL_AUTH_FAILED`, `TRADING_DISABLED` – refused
          before queuing (422) when the account's `status` shows the terminal could not execute (see
          `AccountStatus`); `AGENT_OFFLINE` also appears in `Command.error` of an `expired` command.
        * `EA_NOT_INSTALLED`, `TEMPLATE_APPLY_FAILED`, `COMMAND_TIMEOUT`, `RECONCILE_MISMATCH` – reported in
          `Command.error` of a `failed` command.
        * `INTERNAL` (500).

    # ------------------------------------------------------------------ catalog
    Preset:
      type: object
      required: [id, label]
      properties:
        id: { type: string, examples: [low, medium, high] }
        label: { type: string }
        description: { type: string }
    EaSummary:
      type: object
      required: [ea_id, name, category, status, restart_safety, supports_soft_stop, symbols_allowed, presets]
      properties:
        ea_id: { $ref: "#/components/schemas/EaId" }
        name: { type: string }
        vendor: { type: string }
        version: { type: [string, "null"] }
        category: { type: string, enum: [grid, scalper, news, trend, breakout, other] }
        description: { type: string }
        status:
          type: string
          enum: [draft, reviewed, approved, retired]
          description: Only `approved` EAs can be started on real accounts.
        restart_safety:
          type: string
          enum: [untested, verified, conditional, unsafe]
          description: Whether re-applying the template while positions are open is known to be safe. Parameter changes on instances with open positions require `verified` (or `conditional` with its conditions met).
        supports_soft_stop:
          type: boolean
          description: "The EA has a 'no new trades' input, so `stop_ea` with `mode: soft` is available."
        symbols_allowed:
          type: array
          items: { type: string }
        presets:
          type: array
          items: { $ref: "#/components/schemas/Preset" }
        default_preset: { type: [string, "null"] }
    EaParameter:
      type: object
      required: [name, type, default, changeable, requires_confirmation]
      properties:
        name:
          type: string
          description: Exact input variable name. Use this in `set_param`.
        label: { type: string, description: Name shown in the terminal's Inputs dialog. }
        description: { type: string }
        type: { type: string, enum: [bool, int, double, string, csv, enum] }
        default: { description: Effective default (from the base set file, not necessarily the vendor's compiled default). }
        group: { type: string }
        changeable: { type: boolean }
        constraints:
          type: object
          description: Present when `changeable` is true.
          properties:
            min: { type: number }
            max: { type: number }
            step: { type: number }
            allowed: { type: array, items: {} }
            subset_of:
              type: string
              description: For csv inputs – every value must come from this list (e.g. `symbols_allowed`).
            requires_flat:
              type: boolean
              description: |
                The input may only change while the instance has no open positions and no pending
                orders (the EA would lose them after the restart, e.g. `Symbols`). Enforced server-side:
                otherwise the command is refused with `RESTART_UNSAFE` naming the input in `details.inputs`.
        enum_labels:
          type: object
          additionalProperties: { type: string }
          description: Index → label for enum inputs.
        requires_confirmation:
          type: boolean
          description: Changing this affects risk or exposure; the caller should confirm with the user first. Advisory – the server does not block.
    EaDetail:
      allOf:
        - $ref: "#/components/schemas/EaSummary"
        - type: object
          required: [parameters]
          properties:
            parameters:
              type: array
              items: { $ref: "#/components/schemas/EaParameter" }
            notes: { type: string }

    # ------------------------------------------------------------------ provisioning
    VpsCreate:
      type: object
      properties:
        client_id:
          allOf: [{ $ref: "#/components/schemas/ClientId" }]
          description: Optional; if present it must equal the path parameter.
        external_ref:
          type: string
          maxLength: 128
          description: Your own id for this VPS (e.g. the hosting provider's server id). Returned in state as `vps.external_ref`.
        label:
          type: string
          maxLength: 128
          description: Free text shown in state under `host.label`.
    VpsProvisioned:
      type: object
      required: [vps_id, client_id, enroll_token, status, created_at]
      properties:
        vps_id: { type: string, examples: [vps_7f3k2m] }
        client_id: { $ref: "#/components/schemas/ClientId" }
        external_ref: { type: [string, "null"] }
        enroll_token:
          type: string
          description: One-time token for the agent configuration on that machine. Shown only in this response.
          examples: [enr_5Kz…]
        status: { type: string, enum: [offline] }
        created_at: { type: string, format: date-time }
        instructions: { type: string }

    # ------------------------------------------------------------------ state
    ClientState:
      type: object
      required: [client_id, as_of, stale, vps, accounts]
      properties:
        client_id: { $ref: "#/components/schemas/ClientId" }
        as_of: { type: string, format: date-time }
        stale: { type: boolean }
        vps:
          type: array
          items: { $ref: "#/components/schemas/VpsState" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountState" }
    VpsState:
      type: object
      required: [vps_id, status, last_seen]
      properties:
        vps_id: { type: string, examples: [vps_7f3k2m] }
        external_ref:
          type: [string, "null"]
          description: The integrating platform's own id for this VPS (e.g. the hosting provider's server id), given at enrolment. Null when not provided.
          examples: [VPS-3391-LDN]
        status:
          type: string
          enum: [online, offline, degraded, decommissioned]
          description: |
            `degraded` = the agent reports but something is wrong (see `host.auth_error` etc.);
            `decommissioned` = switched off by the operator, the agent has stopped.
        machine_bound:
          type: boolean
          description: The agent key of this VPS is bound to a machine fingerprint (true for every agent enrolled since 0.2.0).
        agent_version: { type: string }
        last_seen: { type: string, format: date-time }
        host:
          type: object
          properties:
            hostname: { type: string }
            os: { type: string }
            cpu_pct: { type: number }
            mem_pct: { type: number }
            disk_free_gb: { type: number }
            uptime_s: { type: integer }
        terminals: { type: integer, description: Number of MT5 terminals managed on this VPS. }
    TerminalState:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean, description: Terminal has a live connection to the broker server. }
        build: { type: [integer, "null"] }
        trade_allowed: { type: [boolean, "null"], description: AutoTrading enabled in the terminal. }
        last_tick_at: { type: [string, "null"], format: date-time }
        disconnected_since: { type: [string, "null"], format: date-time, description: Start of the current outage, if any. }
        previous_build: { type: [integer, "null"], description: Build the terminal ran before its last update (MT5 LiveUpdate applies at a restart). }
        manager_version: { type: [string, "null"], description: Version of the TcaManager running in this terminal (a new build loads at the next terminal restart, normally in the maintenance window). }
        manager_mode: { type: [string, "null"], enum: [service, ea, null], description: How the manager runs — as an MQL5 service (normal) or as a chart EA (fallback). }
        build_changed_at: { type: [string, "null"], format: date-time, description: When the build change was first observed. }
        discovered:
          type: boolean
          description: |
            The agent found this terminal running on the VPS by itself (not part of the provisioning
            config) and took it under management: a terminal the customer installed later.
        path: { type: [string, "null"], description: Install directory of the terminal on the VPS. }
    AccountStatus:
      type: string
      enum: [ok, degraded, disconnected, auth_failed, unknown]
      description: |
        * `ok` – terminal connected, AutoTrading on, agent reporting.
        * `degraded` – connected but something needs attention (`status_reason`): AutoTrading off, a
          connection blip under a minute, manager EA silent.
        * `disconnected` – no broker connection for over a minute. The agent restarts the terminal
          if the outage lasts (default after 5 min, at most every 15 min).
        * `auth_failed` – the broker rejected the login; the agent does **not** restart in this case
          (credentials need attention). Commands are refused with `TERMINAL_AUTH_FAILED`.
        * `unknown` – the agent has not reported within the freshness window (`stale: true`).
        Commands on an account that is not `ok` (or `degraded` with AutoTrading on) are refused
        before queuing: `AGENT_OFFLINE`, `TERMINAL_NOT_CONNECTED`, `TERMINAL_AUTH_FAILED`,
        `TRADING_DISABLED` (stop_ea is still allowed with AutoTrading off).
    AccountState:
      type: object
      required: [account_id, vps_id, mt5_login, mt5_server, currency, status, terminal, as_of, stale, instances]
      properties:
        account_id: { type: string, examples: [acc_9q1x7d] }
        client_id: { $ref: "#/components/schemas/ClientId" }
        vps_id: { type: string }
        mt5_login: { type: integer }
        mt5_server: { type: string }
        broker: { type: string }
        name: { type: string, description: Account holder name as reported by the terminal. }
        currency: { type: string }
        leverage: { type: integer }
        type: { type: string, enum: [demo, real, contest] }
        status: { $ref: "#/components/schemas/AccountStatus" }
        status_reason: { type: [string, "null"], description: Human-readable explanation when status is not `ok`; safe to show to the user. }
        terminal: { $ref: "#/components/schemas/TerminalState" }
        balance: { type: number }
        equity: { type: number }
        margin: { type: number }
        free_margin: { type: number }
        margin_level: { type: [number, "null"] }
        floating_pnl: { type: number }
        as_of: { type: string, format: date-time }
        stale: { type: boolean }
        instances:
          type: array
          items: { $ref: "#/components/schemas/Instance" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        orders:
          type: array
          items: { $ref: "#/components/schemas/PendingOrder" }
    InstanceStatus:
      type: string
      enum: [starting, running, paused, stopping, stopped, error, unknown]
      description: |
        `paused` = on the chart but new trades disallowed (soft stop). `unknown` = the agent
        cannot currently observe the chart (terminal restarting, agent reconnecting).
    Instance:
      type: object
      required: [instance_id, ea_id, ea_name, status, symbol, timeframe, inputs]
      properties:
        instance_id: { $ref: "#/components/schemas/InstanceId" }
        ea_id: { $ref: "#/components/schemas/EaId" }
        ea_name: { type: string }
        status: { $ref: "#/components/schemas/InstanceStatus" }
        symbol: { type: string, description: Chart symbol. Multi-symbol EAs trade their own list; see `inputs`. }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        preset:
          type: [string, "null"]
          description: Preset last applied, or null when inputs were set individually.
        uid: { type: [integer, "null"], description: Instance number passed to the EA (UID input) where applicable. }
        inputs:
          type: object
          additionalProperties: {}
          description: Effective caller-visible inputs (hidden inputs omitted).
        magic:
          type: [integer, "null"]
          description: |
            Effective magic number of this running copy, read back from the EA's inputs on the
            terminal. Null when the EA does not expose its magic as an input and the catalog has no
            fixed value for it.
        magic_default:
          type: [integer, "null"]
          description: The catalog value for the same input (vendor default), for comparison.
        magic_changed:
          type: boolean
          description: |
            `magic` differs from `magic_default` – someone edited the magic number in the terminal.
            Reporting keyed on catalog magic numbers would silently lose this instance's trades;
            use `magic` (or `magic_numbers`) instead.
        magic_numbers:
          type: array
          items: { type: integer }
          description: |
            Magic numbers this instance's trades carry. Seeded from the EA's magic input (or the catalog's fixed value)
            when the copy starts or is adopted; for EAs that derive the magic from several inputs it is learned from the
            order comment as the first trade appears.
        started_at: { type: [string, "null"], format: date-time }
        last_command_id: { type: [string, "null"] }
        open_positions: { type: integer }
        pending_orders: { type: integer }
        floating_pnl: { type: number }
        health:
          type: object
          properties:
            on_chart: { type: boolean, description: The EA is attached to its chart (observed, not assumed). }
            last_seen_on_chart: { type: [string, "null"], format: date-time }
            errors:
              type: array
              items: { type: string }
              description: Recent journal lines for this EA that look like errors.
            adopted: { type: boolean, description: The copy was found running on the chart and adopted, not started through the API. }
            duplicate_of:
              type: string
              description: Present when this copy is a second chart of the same EA/symbol/settings; AlgoHand closes such a twin only when it created it itself.
            magic_conflict:
              type: string
              description: |
                Present when an adopted copy trades with the same magic number as another running instance (its id):
                their trades cannot be told apart until one of them gets a different magic number.
    Position:
      type: object
      required: [ticket, symbol, type, volume, price_open, profit, magic]
      properties:
        ticket: { type: integer }
        symbol: { type: string }
        type: { type: string, enum: [buy, sell] }
        volume: { type: number }
        price_open: { type: number }
        price_current: { type: number }
        sl: { type: number }
        tp: { type: number }
        profit: { type: number }
        swap: { type: number }
        magic: { type: integer }
        comment: { type: string }
        ea_id: { type: [string, "null"] }
        instance_id: { type: [string, "null"] }
        opened_at: { type: string, format: date-time }
    PendingOrder:
      type: object
      required: [ticket, symbol, type, volume, price_open, magic]
      properties:
        ticket: { type: integer }
        symbol: { type: string }
        type: { type: string, enum: [buy_limit, sell_limit, buy_stop, sell_stop, buy_stop_limit, sell_stop_limit] }
        volume: { type: number }
        price_open: { type: number }
        sl: { type: number }
        tp: { type: number }
        magic: { type: integer }
        comment: { type: string }
        ea_id: { type: [string, "null"] }
        instance_id: { type: [string, "null"] }
        placed_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }

    # ------------------------------------------------------------------ history
    Deal:
      type: object
      required: [deal_id, time, symbol, type, entry, volume, price, profit, magic]
      properties:
        deal_id: { type: integer }
        order_id: { type: integer }
        position_id: { type: integer }
        time: { type: string, format: date-time }
        symbol: { type: string }
        type: { type: string, enum: [buy, sell, balance, credit, charge, correction, bonus, commission, other] }
        entry: { type: string, enum: [in, out, inout, out_by] }
        volume: { type: number }
        price: { type: number }
        profit: { type: number }
        swap: { type: number }
        commission: { type: number }
        fee: { type: number }
        magic: { type: integer }
        comment: { type: string }
        ea_id: { type: [string, "null"], description: Attributed via magic number, comment as fallback; null if unattributed (manual trade, unknown EA). }
        instance_id: { type: [string, "null"] }
    HistoryPage:
      type: object
      required: [account_id, deals, as_of]
      properties:
        account_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        deals:
          type: array
          items: { $ref: "#/components/schemas/Deal" }
        next_cursor: { type: [string, "null"] }
        as_of: { type: string, format: date-time }

    # ------------------------------------------------------------------ analytics
    EquityCurve:
      type: object
      required: [account_id, currency, from, to, summary, points]
      properties:
        account_id: { type: string }
        currency: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        summary:
          type: object
          properties:
            source: { type: string, enum: [samples, deals] }
            samples: { type: integer, description: Raw samples (or deals) in the window. }
            points: { type: integer }
            step_s: { type: integer }
            start_equity: { type: [number, "null"], description: "`samples` only." }
            end_equity: { type: [number, "null"] }
            start_balance: { type: [number, "null"] }
            end_balance: { type: [number, "null"] }
            min_equity: { type: [number, "null"] }
            max_equity: { type: [number, "null"] }
            min_balance: { type: [number, "null"], description: "`deals` only." }
            max_balance: { type: [number, "null"] }
            max_drawdown: { type: number, description: Largest peak-to-trough drop of equity (`samples`) or balance (`deals`) in the window, account currency. }
            max_drawdown_pct: { type: number }
            max_drawdown_at: { type: [string, "null"], format: date-time }
            change: { type: [number, "null"], description: end − start of equity (`samples`) or balance (`deals`). }
        points:
          type: array
          items:
            type: object
            required: [at, balance]
            properties:
              at: { type: string, format: date-time }
              balance: { type: number }
              equity: { type: number, description: "`samples` only." }
              floating_pnl: { type: number, description: "`samples` only." }
    PnlReport:
      type: object
      required: [account_id, currency, from, to, group, total, groups, curve]
      properties:
        account_id: { type: string }
        currency: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        group: { type: string, enum: [ea, instance, symbol, day, hour, weekday] }
        total:
          type: object
          properties:
            profit: { type: number }
            deals: { type: integer }
            wins: { type: integer }
            losses: { type: integer }
            win_rate_pct: { type: [number, "null"] }
            profit_factor: { type: [number, "null"] }
            max_drawdown: { type: number, description: Largest peak-to-trough drop of the cumulative closed P&L in the window. }
            max_drawdown_at: { type: [string, "null"], format: date-time }
        groups:
          type: array
          description: Best first; chronological for `day`, `hour` (00–23) and `weekday` (Mon–Sun).
          items:
            type: object
            required: [key, label, deals, profit]
            properties:
              key: { type: string, description: ea_id / instance_id / symbol / date / "HH" / "Mon".."Sun"; `unattributed` for manual or unknown trades. }
              label: { type: string }
              deals: { type: integer }
              wins: { type: integer }
              losses: { type: integer }
              profit: { type: number }
              gross_profit: { type: number }
              gross_loss: { type: number }
              best: { type: [number, "null"] }
              worst: { type: [number, "null"] }
              avg_profit: { type: [number, "null"] }
              profit_factor: { type: [number, "null"] }
              win_rate_pct: { type: [number, "null"] }
              max_drawdown: { type: number, description: Largest peak-to-trough drop of this group's cumulative closed P&L. }
              max_drawdown_at: { type: [string, "null"], format: date-time }
        curve:
          type: array
          description: Cumulative closed P&L over the window, one point per closing deal.
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              cumulative: { type: number }
        curves:
          type: object
          description: The same per group key.
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                at: { type: string, format: date-time }
                cumulative: { type: number }

    # ------------------------------------------------------------------ commands
    CommandType:
      type: string
      enum: [start_ea, stop_ea, set_risk, set_param, restart_ea, run_backtest, install_ea, discover_ea]
      description: "`run_backtest` runs the Strategy Tester on the customer's VPS (see POST /v1/backtests); it has no instance. `install_ea` / `discover_ea` are queued by the EA onboarding endpoints (`/v1/clients/{client_id}/eas`), never posted to `/commands` directly."
    CommandStatus:
      type: string
      enum: [queued, dispatched, running, succeeded, failed, rejected, expired, cancelled]
      description: |
        `queued` → `dispatched` (agent picked it up) → `running` (template being applied) →
        `succeeded` | `failed`. `rejected` = failed validation after queuing (rare; normally 422 at creation).
        `expired` = agent did not pick it up before `expires_at` (VPS offline). `cancelled` = cancelled while queued.
    InputValue:
      description: A value for an EA input. Booleans as JSON booleans, numbers as JSON numbers, csv/strings as strings, enums as their integer index.
      oneOf:
        - { type: boolean }
        - { type: number }
        - { type: string }
    InputMap:
      type: object
      additionalProperties: { $ref: "#/components/schemas/InputValue" }
      description: Input variable name → value. Names are case-sensitive and must match `EaParameter.name`.
      examples:
        - { MaximumSpread: 15, NewsFilterEnabled: true }

    StartEaParams:
      type: object
      required: [ea_id]
      properties:
        ea_id: { $ref: "#/components/schemas/EaId" }
        preset:
          type: string
          description: Risk preset id from the catalog. Defaults to the EA's `default_preset`.
        symbol:
          type: string
          description: Chart symbol to attach to. Defaults to the EA's default. Must be in `symbols_allowed`.
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        inputs:
          $ref: "#/components/schemas/InputMap"
          description: Overrides applied on top of the preset. Whitelist applies.
    StopEaParams:
      type: object
      required: [instance_id]
      properties:
        instance_id: { $ref: "#/components/schemas/InstanceId" }
        mode:
          type: string
          enum: [soft, hard]
          default: soft
          description: |
            `soft` – disallow new trades; the EA stays on the chart and keeps managing its open positions until they close
            (instance status becomes `paused`). Requires `supports_soft_stop`.
            `hard` – remove the EA from the chart. Open positions and pending orders are left untouched and unmanaged.
        positions:
          type: string
          enum: [keep, close]
          default: keep
          description: "`close` – close all positions and pending orders attributed to this instance before stopping. Not enabled in the pilot; returns UNSUPPORTED_MODE."
    SetRiskParams:
      type: object
      required: [instance_id, preset]
      properties:
        instance_id: { $ref: "#/components/schemas/InstanceId" }
        preset: { type: string, description: Risk preset id from the catalog. }
    SetParamParams:
      type: object
      required: [instance_id, inputs]
      properties:
        instance_id: { $ref: "#/components/schemas/InstanceId" }
        inputs:
          $ref: "#/components/schemas/InputMap"
          description: One or more inputs to change. Everything else keeps its current value.
    RestartEaParams:
      type: object
      required: [instance_id]
      properties:
        instance_id: { $ref: "#/components/schemas/InstanceId" }
        inputs:
          $ref: "#/components/schemas/InputMap"
          description: Optional inputs to change during the restart. Same rules as `set_param`.

    CommandCreate:
      type: object
      required: [type, params]
      properties:
        client_id:
          allOf: [{ $ref: "#/components/schemas/ClientId" }]
          description: Required with a tenant key. Optional with a client key; if present it must match the key's client.
        type: { $ref: "#/components/schemas/CommandType" }
        params:
          description: Type-specific parameters (see `type`).
          oneOf:
            - $ref: "#/components/schemas/StartEaParams"
            - $ref: "#/components/schemas/StopEaParams"
            - $ref: "#/components/schemas/SetRiskParams"
            - $ref: "#/components/schemas/SetParamParams"
            - $ref: "#/components/schemas/RestartEaParams"
        dry_run:
          type: boolean
          default: false
          description: Validate and compute the diff, do not queue. Response is `200 CommandPreview`.
        requested_by:
          type: string
          maxLength: 128
          description: Free-text actor for the audit trail, e.g. `edgard`, `user:5521`, `support:anna`.
        reason:
          type: string
          maxLength: 500
          description: Free-text reason, e.g. the user's message that triggered the command. Stored, shown in the audit trail.
        callback_url:
          type: string
          format: uri
          description: |
            Reserved for webhooks. Accepted and stored, but **not delivered in 0.x** – poll
            `GET /v1/commands/{command_id}?wait=30` instead. When webhooks ship, this URL will
            receive a signed POST with the final `Command` object; no schema change will be needed
            on the caller's side.
        ttl_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 600
          description: How long the command may wait for the agent before expiring.
    Diff:
      type: object
      required: [name, was, now]
      properties:
        name: { type: string }
        label: { type: string }
        was: {}
        now: {}
    Resolved:
      type: object
      description: What the server decided to apply after validation.
      required: [ea_id, ea_name, instance_id, symbol, restarts_ea, diff]
      properties:
        ea_id: { $ref: "#/components/schemas/EaId" }
        ea_name: { type: string }
        instance_id: { $ref: "#/components/schemas/InstanceId" }
        symbol: { type: string }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        preset: { type: [string, "null"] }
        restarts_ea: { type: boolean, description: True for every command except a hard stop of a stopped instance. }
        open_positions_at_request: { type: integer }
        diff:
          type: array
          items: { $ref: "#/components/schemas/Diff" }
          description: Input changes that will be applied (was → now). Empty for start and hard stop; a soft stop shows the kill-switch input.
    BacktestResolved:
      type: object
      description: What the server decided for a `run_backtest` command.
      required: [ea_id, ea_name, symbol, timeframe, period, deposit, currency, leverage, tick_model, runs_on]
      properties:
        ea_id: { $ref: "#/components/schemas/EaId" }
        ea_name: { type: string }
        symbol: { type: string }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        preset: { type: [string, "null"] }
        period: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
        deposit: { type: number }
        currency: { type: string }
        leverage: { type: integer }
        tick_model: { type: string, enum: [every_tick_real, every_tick, one_minute_ohlc, open_prices] }
        tick_model_label: { type: string }
        inputs: { $ref: "#/components/schemas/InputMap", description: The effective inputs (preset + overrides), hidden ones removed. }
        diff:
          type: array
          items: { $ref: "#/components/schemas/Diff" }
          description: The caller's input overrides on top of the preset.
        runs_on: { type: string, const: customer_vps }
        host:
          type: object
          description: What the agent last reported about the VPS (cpus, mem_total_gb, mem_available_gb, os), for the consent warning.
    Observed:
      type: object
      description: What the agent saw on the terminal after executing.
      properties:
        instance_status: { $ref: "#/components/schemas/InstanceStatus" }
        inputs: { $ref: "#/components/schemas/InputMap" }
        open_positions: { type: integer }
        pending_orders: { type: integer }
        observed_at: { type: string, format: date-time }
    CommandResult:
      type: object
      required: [observed, reconciled, notes]
      properties:
        observed: { $ref: "#/components/schemas/Observed" }
        reconciled:
          type: boolean
          description: "True when `observed` matches `resolved`. A command with `reconciled: false` is `failed` with `RECONCILE_MISMATCH`."
        notes:
          type: array
          items: { type: string }
        backtest:
          oneOf:
            - $ref: "#/components/schemas/BacktestResult"
            - type: "null"
          description: Present only for `run_backtest` commands.
        report_url:
          type: [string, "null"]
          description: "`run_backtest` only: path of the tester's full HTML report (`GET /v1/commands/{command_id}/report`)."

    # ------------------------------------------------------------------ embedded chat
    ChatCodeCreate:
      type: object
      properties:
        client_id: { $ref: "#/components/schemas/ClientId" }
        label: { type: string, maxLength: 128, description: Your reference (session id, user id) for the audit trail. }
        display_name: { type: string, maxLength: 128, description: Shown in the chat as the account name. }
        ttl_hours: { type: integer, minimum: 1, maximum: 2160, default: 24 }
        lang: { type: string, enum: [en, ru, es], description: UI language of the chat chrome; the assistant answers in the language the customer writes anyway. }
    ChatCode:
      type: object
      required: [code, client_id, url, embed_url, widget_snippet, created_at, expires_at]
      properties:
        code: { type: string, examples: [ah-3f9a1c2b7d4e] }
        client_id: { $ref: "#/components/schemas/ClientId" }
        label: { type: [string, "null"] }
        display_name: { type: [string, "null"] }
        url: { type: string, format: uri, description: Full-page chat. }
        embed_url: { type: string, format: uri, description: Chat only (no sidebar), for an iframe. }
        widget_snippet: { type: string, description: "The `<script>` tag for the corner widget (attributes: data-code, data-lang, data-position left|right, data-title, data-color)." }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }

    # ------------------------------------------------------------------ backtests (v2)
    CustomEa:
      type: object
      description: "An EA the customer onboards themselves (EA onboarding). The full view (single-item GET, patch, confirm) adds `parameters`, `draft`, `journal` and, once confirmed, `document`."
      required: [custom_id, client_id, name, file, status]
      properties:
        custom_id: { type: string, example: cust_ab12cd34 }
        ea_id:
          type: [string, "null"]
          description: "Set once confirmed: equals `custom_id`. Use it as `ea_id` in commands."
        client_id: { $ref: "#/components/schemas/ClientId" }
        name: { type: string, example: "Gold Scalper" }
        file: { type: string, example: "GoldScalper.ex5" }
        expert_path: { type: string, example: "Experts\\TCA\\GoldScalper.ex5" }
        sha256: { type: [string, "null"], description: "Of the uploaded file; null for an EA found on the VPS." }
        status:
          type: string
          enum: [uploaded, installed, discovered, drafted, confirmed, failed]
        error: { type: [string, "null"] }
        source_url: { type: [string, "null"] }
        inputs_count: { type: integer }
        installs:
          type: object
          description: "Terminal name → {ok, path | error} from the install command."
          additionalProperties: true
        last_command_id: { type: [string, "null"] }
        next: { type: string, description: "What happens or is expected next, in words." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        parameters:
          type: array
          description: "Full view: every input as discovered — name, type (bool | int | double | string | csv | enum), default, enum_candidate."
          items: { type: object, additionalProperties: true }
        draft:
          type: object
          description: "Full view: the profile draft — `inputs` (name → label, description, category, is_risk, changeable, hidden, requires_flat, min, max, step, allowed, enum_labels, enum_guess, confidence, provenance), `kill_switch`, `magic_input`, `symbols_input`, `symbols_allowed`, `default_symbol`, `default_timeframe`, `presets`, `default_preset`, `source` (heuristic | ai), `notes`."
          additionalProperties: true
        journal:
          type: array
          description: "Full view: terminal log lines mentioning the EA at discovery (licence errors show up here)."
          items: { type: string }
        document:
          type: object
          description: "Full view, confirmed only: the registry-shaped catalog document the server enforces."
          additionalProperties: true
    CustomEaWithCommand:
      allOf:
        - $ref: "#/components/schemas/CustomEa"
        - type: object
          properties:
            command: { $ref: "#/components/schemas/Command" }
    OnVpsExpert:
      type: object
      description: "An .ex5 the agent found under MQL5\\Experts of a terminal."
      properties:
        file: { type: string }
        path: { type: [string, "null"] }
        sha256: { type: [string, "null"] }
        size: { type: [integer, "null"] }
        terminals: { type: array, items: { type: integer }, description: "MT5 logins of the terminals that have the file." }
        catalog_ea_id: { type: string, description: "Present when the file is a catalog EA." }
        custom_id: { type: string, description: "Present when the customer already onboarded it." }
        custom_status: { type: string }
    CustomEaList:
      type: object
      properties:
        client_id: { $ref: "#/components/schemas/ClientId" }
        eas: { type: array, items: { $ref: "#/components/schemas/CustomEa" } }
        on_vps: { type: array, items: { $ref: "#/components/schemas/OnVpsExpert" } }
    AlertCreate:
      type: object
      required: [kind, params, text]
      properties:
        client_id: { $ref: "#/components/schemas/ClientId" }
        kind:
          type: string
          enum: [balance_below, balance_above, equity_below, equity_above, floating_pnl_below, floating_pnl_above, drawdown_pct, daily_loss_pct, margin_level_below, positions_above, ea_off_chart, deal_closed, terminal_disconnected, vps_offline, command_failed, price]
        params: { type: object, additionalProperties: true, description: "value | pct | count | symbol+level+direction | ea_id | instance_id | vps_id | min_abs_profit, per kind." }
        text: { type: string, maxLength: 256, description: "The rule in the customer's words; shown in every notification." }
        account_id: { type: string, description: "Required when the client has several accounts (account-scoped kinds)." }
        channels: { type: array, items: { type: string, enum: [telegram, email] } }
        repeat: { type: boolean, default: false }
        cooldown_s: { type: integer, default: 3600, minimum: 60, maximum: 86400 }
        requested_by: { type: string }
    Alert:
      type: object
      properties:
        alert_id: { type: string, example: "alr_7f3a9c21" }
        client_id: { $ref: "#/components/schemas/ClientId" }
        account_id: { type: string, nullable: true }
        kind: { type: string }
        params: { type: object, additionalProperties: true }
        text: { type: string }
        channels: { type: array, items: { type: string } }
        status: { type: string, enum: [armed, fired, paused, waiting_agent] }
        repeat: { type: boolean }
        cooldown_s: { type: integer }
        created_at: { type: string, format: date-time }
        last_fired_at: { type: string, format: date-time, nullable: true }
        fired_count: { type: integer }
        last_value: { nullable: true }
        description: { type: string }
        note: { type: string, nullable: true, description: "Creation responses: e.g. Telegram not linked yet, or price rules waiting for the agent." }
        events:
          type: array
          items:
            type: object
            properties:
              fired_at: { type: string, format: date-time }
              value: { type: number, nullable: true }
              message: { type: string }
              delivered: { type: object, additionalProperties: true }
    SupportTicketCreate:
      type: object
      required: [message]
      properties:
        client_id: { $ref: "#/components/schemas/ClientId" }
        subject: { type: string, maxLength: 256 }
        message: { type: string, maxLength: 8000, description: "The customer's question plus the facts already established." }
        email: { type: string, description: "Required when the client has no dashboard account." }
        name: { type: string }
        lang: { type: string, enum: [en, ru, es], description: "Detected from the message when omitted." }
        context:
          type: object
          additionalProperties: true
          description: "Optional; `summary` = a one-paragraph summary of the conversation, shown to the team."
    SupportMessage:
      type: object
      properties:
        id: { type: integer }
        author: { type: string, enum: [customer, assistant, team] }
        text: { type: string }
        draft: { type: boolean, description: "Always false in customer-facing responses." }
        created_at: { type: string, format: date-time }
    SupportTicket:
      type: object
      properties:
        ticket_id: { type: string, example: "tkt_7f3a9c21" }
        subject: { type: string }
        status:
          type: string
          enum: [open, answered, escalated, human_answered, closed]
          description: "`answered` = by the assistant; `escalated` = a person is looking at it; `human_answered` = the team replied."
        lang: { type: string }
        source: { type: string, enum: [site, portal, chat, api] }
        name: { type: string, nullable: true }
        email: { type: string, nullable: true, description: "Only in the team's view." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        link: { type: string, description: "The ticket page (creation responses only)." }
        messages: { type: array, items: { $ref: "#/components/schemas/SupportMessage" } }
    CustomEaFromVps:
      type: object
      required: [from_vps]
      properties:
        client_id: { $ref: "#/components/schemas/ClientId" }
        from_vps:
          type: object
          required: [file]
          properties:
            file: { type: string, example: "GoldScalper.ex5" }
            path: { type: string, example: "Experts\\Vendor\\GoldScalper.ex5" }
        source_url: { type: string }
        requested_by: { type: string }
    DiscoverEaBody:
      type: object
      properties:
        client_id: { $ref: "#/components/schemas/ClientId" }
        symbol: { type: string, description: "Chart symbol of the discovery chart; default EURUSD." }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        requested_by: { type: string }
    EaDraftInput:
      type: object
      properties:
        label: { type: string }
        description: { type: string }
        category: { type: string, enum: [risk, entry, exit, filters, news, time, display, licence, magic, other] }
        is_risk: { type: boolean }
        changeable: { type: boolean }
        hidden: { type: boolean }
        requires_flat: { type: boolean }
        min: { type: number }
        max: { type: number }
        step: { type: number }
        allowed: { type: array, items: {} }
        enum_labels:
          type: object
          description: "Index (as a string) → option name, as shown in the terminal's Inputs dialog."
          additionalProperties: { type: string }
        type: { type: string, enum: [int, double, enum] }
    EaPreset:
      type: object
      required: [id]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" }
        label: { type: string }
        description: { type: string }
        inputs: { type: object, additionalProperties: true }
    EaDraftPatch:
      type: object
      properties:
        client_id: { $ref: "#/components/schemas/ClientId" }
        name: { type: string }
        description: { type: string }
        category: { type: string, enum: [grid, scalper, news, trend, breakout, other] }
        inputs:
          type: object
          additionalProperties: { $ref: "#/components/schemas/EaDraftInput" }
        kill_switch:
          type: [object, "null"]
          properties:
            input: { type: string }
            off_value: {}
            on_value: {}
        clear_kill_switch: { type: boolean }
        magic_input: { type: string }
        symbols_allowed: { type: array, items: { type: string } }
        default_symbol: { type: string }
        default_timeframe: { $ref: "#/components/schemas/Timeframe" }
        presets: { type: array, items: { $ref: "#/components/schemas/EaPreset" } }
        default_preset: { type: string }
        source_url: { type: string }
    BacktestCreate:
      type: object
      required: [account_id, ea_id, from, to]
      properties:
        client_id: { $ref: "#/components/schemas/ClientId" }
        account_id: { type: string, description: The account whose terminal (and VPS) runs the test; its login gives the tester the broker history and the EA licence. }
        ea_id: { $ref: "#/components/schemas/EaId" }
        preset: { type: string, description: Risk preset; defaults to the EA's default preset. }
        inputs: { $ref: "#/components/schemas/InputMap" }
        symbol: { type: string, description: Defaults to the EA's default symbol; must be in its allowed list. }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        from: { type: string, format: date }
        to: { type: string, format: date, description: Not later than today. }
        deposit: { type: number, description: Defaults to the account's current balance. }
        currency: { type: string, description: Defaults to the account currency. }
        leverage: { type: integer, description: Defaults to the account leverage. }
        tick_model:
          type: string
          enum: [every_tick_real, every_tick, one_minute_ohlc, open_prices]
          default: every_tick_real
          description: MT5 tester modelling — every tick based on real ticks (4), every tick (0), 1 minute OHLC (1), open prices only (2).
        consent: { type: boolean, default: false, description: The customer accepted that the test runs on their VPS next to the live terminals (asked once per client). }
        dry_run: { type: boolean, default: false }
        requested_by: { type: string, maxLength: 128 }
        reason: { type: string, maxLength: 500 }
        callback_url: { type: string, format: uri }
    BacktestResult:
      type: object
      required: [net_profit, max_drawdown_pct, trades]
      properties:
        net_profit: { type: number }
        gross_profit: { type: number }
        gross_loss: { type: number }
        max_drawdown_pct: { type: number, description: Maximal balance/equity drawdown, percent of the deposit. }
        max_drawdown_money: { type: number }
        profit_factor: { type: [number, "null"] }
        recovery_factor: { type: [number, "null"] }
        sharpe: { type: [number, "null"] }
        expected_payoff: { type: number }
        trades: { type: integer }
        win_rate_pct: { type: number }
        initial_deposit: { type: number }
        period: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
        history_quality_pct: { type: [number, "null"], description: Tester's modelling quality. }
        duration_s: { type: [number, "null"], description: How long the tester ran on the VPS. }
        simulated: { type: boolean, description: True for sandbox results (no terminal involved). }
    TimelineEntry:
      type: object
      required: [status, at]
      properties:
        status: { $ref: "#/components/schemas/CommandStatus" }
        at: { type: string, format: date-time }
        note: { type: string }
    Command:
      type: object
      required: [command_id, client_id, account_id, type, status, summary, requested, timeline, created_at, updated_at]
      properties:
        command_id: { type: string, examples: [cmd_01J6X0Q4M9] }
        client_id: { $ref: "#/components/schemas/ClientId" }
        account_id: { type: [string, "null"], description: "The account (and so the VPS and terminal) the command acts on." }
        type: { $ref: "#/components/schemas/CommandType" }
        status: { $ref: "#/components/schemas/CommandStatus" }
        summary:
          type: string
          description: One human-readable sentence describing the command and its current outcome. Safe to show to the end user.
        requested:
          type: object
          additionalProperties: true
          description: The `params` object exactly as received.
        resolved:
          oneOf:
            - $ref: "#/components/schemas/Resolved"
            - $ref: "#/components/schemas/BacktestResolved"
            - type: "null"
        result:
          oneOf:
            - $ref: "#/components/schemas/CommandResult"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/Error"
            - type: "null"
        timeline:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        requested_by: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
    CommandPreview:
      type: object
      required: [valid, type, account_id, summary, resolved, requires_confirmation, warnings]
      properties:
        valid: { type: boolean, const: true }
        type: { $ref: "#/components/schemas/CommandType" }
        account_id: { type: string }
        summary: { type: string }
        resolved:
          oneOf:
            - $ref: "#/components/schemas/Resolved"
            - $ref: "#/components/schemas/BacktestResolved"
        requires_confirmation:
          type: boolean
          description: True if any changed input is flagged `requires_confirmation`, or the command restarts an EA with open positions.
        requires_consent:
          type: boolean
          description: "`run_backtest` only: the client has not yet accepted that backtests run on their VPS."
        consent_text:
          type: string
          description: "`run_backtest` only: the warning to show the customer, with the VPS's cores and memory."
        warnings:
          type: array
          items: { type: string }
