                            symbol: AUDNZD
                            type: buy
                            volume: 0.10
                            price_open: 1.09812
                            price_current: 1.09760
                            sl: 0
                            tp: 1.09912
                            profit: -31.20
                            swap: -1.10
                            magic: 184570000
