                      - account_id: acc_2z8w4p
                        vps_id: vps_7f3k2m
                        mt5_login: 51234568
                        mt5_server: ICMarketsSC-MT5-2
                        broker: IC Markets
                        currency: USD
                        leverage: 500
                        type: real
                        terminal: { connected: true, build: 5120, trade_allowed: true, last_tick_at: "2026-09-02T10:15:05Z" }
                        balance: 5000.00
                        equity: 5000.00
                        margin: 0
                        free_margin: 5000.00
                        margin_level: null
                        floating_pnl: 0
                        as_of: "2026-09-02T10:15:07Z"
